<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Festival Offer Agent | Aarohan QA Analytics</title><meta name="description" content="Demo agent: pick a festival and your offer, get a ready WhatsApp message, status text and Instagram caption in English or Hinglish."><style>
:root{--navy:#081a32;--gold:#d5b46d;--ink:#17273c;--muted:#62718a}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;font-size:14px;border:1px solid #ffffff44;padding:7px 14px;border-radius:99px}
main{max-width:760px;margin:auto;padding:18px 16px 30px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin-bottom:14px}h1{font-size:22px;margin:0 0 4px}h3{margin:12px 0 4px;font-size:15px}p.s{color:var(--muted);font-size:14px;margin:0 0 12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:600;display:block;margin-top:6px}input,select{width:100%;padding:10px;border:1px solid #cdd6e3;border-radius:10px;font:15px system-ui;margin-top:3px}
button{background:var(--navy);color:#fff;border:0;border-radius:99px;padding:11px 20px;font-weight:700;font-size:14px;cursor:pointer;margin:8px 8px 0 0}button.w{background:#16a34a}pre{white-space:pre-wrap;background:#fffaf0;border:1px dashed var(--gold);border-radius:10px;padding:12px;font:14px/1.5 system-ui}.f{font-size:12px;color:var(--muted)}@media(max-width:520px){.g{grid-template-columns:1fr}}
</style></head><body><header><div><b>AAROHAN</b> QA ANALYTICS</div><a href="index.html">&larr; Website</a></header><main>
<div class="card"><h1>Festival Offer Agent</h1><p class="s">Choose the festival, your shop and the offer. You get a WhatsApp message, a short status line and an Instagram caption.</p>
<div class="g"><label>Festival<select id="fe"><option>Diwali</option><option>Raksha Bandhan</option><option>Navratri</option><option>Holi</option><option>Eid</option><option>Christmas</option><option>New Year</option><option>Independence Day</option></select></label><label>Language<select id="lg"><option>English</option><option>Hinglish</option></select></label>
<label>Shop name<input id="sn" value="Glow Beauty Store"></label><label>Offer<input id="of" value="Flat 20% off on gift sets"></label><label>Valid till<input id="vt" value="Sunday"></label><label>Order number (WhatsApp)<input id="ph" value="916357115513"></label></div><button onclick="run()">Write offer</button></div><div id="o"></div><p class="f">Demonstration only. Check the offer terms before posting.</p></main>
<script>
var W={Diwali:["Happy Diwali","Diwali ki hardik shubhkamnayein","gifting and shining homes"],"Raksha Bandhan":["Happy Raksha Bandhan","Raksha Bandhan ki shubhkamnayein","gifts for your brother or sister"],Navratri:["Happy Navratri","Navratri ki shubhkamnayein","festive looks and garba days"],Holi:["Happy Holi","Holi ki hardik shubhkamnayein","colourful celebrations"],Eid:["Eid Mubarak","Eid Mubarak","festive gifts and outfits"],Christmas:["Merry Christmas","Merry Christmas","gifts for loved ones"],"New Year":["Happy New Year","Naye saal ki shubhkamnayein","a fresh start"],"Independence Day":["Happy Independence Day","Swatantrata Diwas ki shubhkamnayein","a proud day sale"]};
function run(){var f=document.getElementById('fe').value,hi=document.getElementById('lg').value==='Hinglish',sn=document.getElementById('sn').value,of=document.getElementById('of').value,vt=document.getElementById('vt').value,ph=document.getElementById('ph').value.replace(/\D/g,''),w=W[f],g=hi?w[1]:w[0];
var wa=hi?g+'! '+sn+' ki taraf se aapko aur parivar ko dher saari shubhkamnayein.\n\n'+f+' special offer: '+of+'.\nOffer '+vt+' tak valid hai.\n\nOrder karne ke liye is number par message karein. Aapka bahut dhanyavaad!':g+'! Warm wishes to you and your family from '+sn+'.\n\n'+f+' special offer: '+of+'.\nValid till '+vt+'.\n\nMessage us on this number to order. Thank you for being with us!';
var st=g+'! '+of+' till '+vt+'. Order on WhatsApp.',ig=g+' from '+sn+'!\n'+of+', valid till '+vt+'.\nPerfect for '+w[2]+'.\nDM or WhatsApp to order.\n#'+f.replace(/\s/g,'')+' #FestivalOffer #ShopLocal #'+sn.replace(/\W/g,'');
function box(t,x,wb){return '<div class="card"><b>'+t+'</b><pre>'+x.replace(/</g,'&lt;')+'</pre><button onclick="navigator.clipboard.writeText(this.previousElementSibling.innerText);this.textContent=\'Copied\'">Copy</button>'+(wb?'<a target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(x)+'"><button class="w">Share on WhatsApp</button></a>':'')+'</div>'}
document.getElementById('o').innerHTML=box('WhatsApp message',wa+(ph?'\nOrder: wa.me/'+ph:''),true)+box('Status text',st,false)+box('Instagram caption',ig,false)}
run();
</script><script src="trial.js"></script></body></html>
