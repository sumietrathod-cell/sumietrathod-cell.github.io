<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Reset CRM password | AAROHAN AI WORLD</title>
<style>
body {background:#07172b;color:#eaf5ff;font:16px system-ui;margin:8vh auto;max-width:28rem;padding:1.5rem}
input,button {display:block;margin:.5rem 0 1rem;padding:.65rem;font:inherit}
a {color:#7cd9ff}
</style>
<h1>Reset CRM password</h1>
<p id="status" role="status">Checking your recovery link…</p>
<form id="request" hidden>
<label>Sales account email <input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
<button type="submit">Send password reset email</button>
</form>
<form id="reset" method="post" hidden>
<label>New password <input name="password" type="password" autocomplete="new-password" required minlength="12"></label>
<label>Confirm new password <input name="confirm" type="password" autocomplete="new-password" required minlength="12"></label>
<button>Save password</button>
</form>
<p>After saving your password, return to your open CRM tab.</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
const form = document.querySelector('#reset');
const requestForm = document.querySelector('#request');
const status = document.querySelector('#status');
const button = form.querySelector('button');
const recovery = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, '', location.pathname);
let client;

try {
  const config = {url: 'https://aubzgcgljfszbgnnlzbn.supabase.co', publishableKey: 'sb_publishable_Uf-jMsWUPV80yFlKHZBpcg_L-eGKEzY'};
  if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(config.url) ||
      !/^sb_publishable_[\w-]+$/.test(config.publishableKey)) throw new Error();
  client = window.supabase.createClient(config.url, config.publishableKey, {
    auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false}
  });
  if (recovery.get('type') === 'recovery' && recovery.get('access_token') && recovery.get('refresh_token')) {
    const {error} = await client.auth.setSession({
      access_token: recovery.get('access_token'),
      refresh_token: recovery.get('refresh_token')
    });
    if (error) throw error;
    form.hidden = false;
    status.textContent = 'Choose a new password with at least 12 characters.';
  } else {
    requestForm.hidden = false;
    status.textContent = 'Request a password reset email for your sales account.';
  }
} catch {
  status.textContent = 'Could not initialize password recovery. Refresh the page or contact the administrator.';
} finally {
  for (const key of ['access_token', 'refresh_token']) recovery.delete(key);
}

requestForm.addEventListener('submit', async event => {
  event.preventDefault();
  const email = requestForm.elements.email.value.trim();
  const btn = requestForm.querySelector('button');
  btn.disabled = true;
  status.textContent = 'Sending password reset request…';
  try {
    const {error} = await client.auth.resetPasswordForEmail(email, {
      redirectTo: new URL('/crm/reset-password.html', location.origin).href
    });
    if (error) throw error;
    status.textContent = 'If this sales account exists, a reset email has been requested. Please check Inbox and Spam.';
    requestForm.hidden = true;
  } catch (error) {
    status.textContent = error?.message || 'Could not send reset email. Check your email address or try again later.';
    btn.disabled = false;
  }
});

form.addEventListener('submit', async event => {
  event.preventDefault();
  const {password, confirm} = form.elements;
  if (password.value !== confirm.value) {
    status.textContent = 'The passwords must match.';
    return;
  }
  button.disabled = true;
  try {
    const {error} = await client.auth.updateUser({password: password.value});
    if (error) throw error;
    form.reset();
    form.hidden = true;
    status.textContent = 'Password updated. Return to CRM and sign in.';
    await client.auth.signOut({scope: 'local'}).catch(() => {});
  } catch {
    status.textContent = 'Could not update your password. Try again or request a fresh recovery link.';
  } finally {
    button.disabled = false;
  }
});
</script>
</html>
