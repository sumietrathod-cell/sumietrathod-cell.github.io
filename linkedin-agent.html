<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkedIn Post Writer Agent | Aarohan QA Analytics</title><meta name="description" content="Demo agent: give a topic and a style, get a ready LinkedIn post with hook, body, call to action and hashtags."><style>
:root{--navy:#081a32;--gold:#d5b46d;--ink:#17273c;--muted:#62718a}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;font-size:14px;border:1px solid #ffffff44;padding:7px 14px;border-radius:99px}
main{max-width:760px;margin:auto;padding:18px 16px 30px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin-bottom:14px}h1{font-size:22px;margin:0 0 4px}p.s{color:var(--muted);font-size:14px;margin:0 0 12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:600;display:block;margin-top:6px}input,select,textarea{width:100%;padding:10px;border:1px solid #cdd6e3;border-radius:10px;font:15px system-ui;margin-top:3px}
button{background:var(--navy);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;margin:12px 8px 0 0}pre{white-space:pre-wrap;background:#fffaf0;border:1px dashed var(--gold);border-radius:10px;padding:12px;font:15px/1.6 system-ui}.f{font-size:12px;color:var(--muted)}@media(max-width:520px){.g{grid-template-columns:1fr}}
</style></head><body><header><div><b>AAROHAN</b> QA ANALYTICS</div><a href="index.html">&larr; Website</a></header><main>
<div class="card"><h1>LinkedIn Post Writer Agent</h1><p class="s">Fill the boxes. The agent builds a post in the style you pick. Edit it to sound like you before posting.</p>
<label>Topic / what happened<input id="t" value="I built an agent that finds overdue CAPA and drafts the escalation mail"></label>
<label>Main point / result<input id="r" value="QA team saves about 2 hours every week chasing overdue items"></label>
<div class="g"><label>Style<select id="st"><option>Problem and solution</option><option>Story</option><option>Tips list</option><option>Announcement</option></select></label><label>Your link<input id="l" value="https://sumietrathod-cell.github.io/"></label>
<label>Your name<input id="n" value="Sumit Rathod"></label><label>Hashtags<input id="h" value="#PharmaQA #CAPA #Automation #AIAgents"></label></div><button onclick="run()">Write post</button></div><div id="o"></div><p class="f">Demonstration only. The agent uses templates, so always review and make it personal.</p></main>
<script>
function run(){var t=document.getElementById('t').value.trim(),r=document.getElementById('r').value.trim(),st=document.getElementById('st').value,l=document.getElementById('l').value.trim(),h=document.getElementById('h').value.trim(),n=document.getElementById('n').value.trim(),x;
if(st==='Problem and solution')x='Still doing this by hand every week?\n\nThe problem: the same manual task keeps eating time and mistakes creep in.\n\nWhat I did: '+t+'.\n\nThe result: '+r+'.\n\nIf you have a similar task in your team, I would love to hear how you handle it today.';
else if(st==='Story')x='A small story from this week.\n\nI noticed a repeated problem at work, and decided to fix it instead of working around it.\n\n'+t+'.\n\nWhat changed: '+r+'.\n\nBiggest lesson: small tools that remove one daily headache are worth more than big plans.';
else if(st==='Tips list')x='3 lessons from this project:\n\n1. Start with the one task that wastes most time.\n2. Build a small working version first and show it to the people who will use it.\n3. Measure the result: '+r+'.\n\nThe project: '+t+'.';
else x='New from me: '+t+'.\n\nWhy it matters: '+r+'.\n\nIt is free to try, no signup. Tell me what you would like to see next.';
x+=(l?'\n\nTry it: '+l:'')+'\n\nWant something similar for your business? Message me on WhatsApp: 6357115513\n\n'+h+(n?'\n\n- '+n:'');
document.getElementById('o').innerHTML='<div class="card"><pre id="p">'+x.replace(/</g,'&lt;')+'</pre><button onclick="navigator.clipboard.writeText(document.getElementById(\'p\').innerText);this.textContent=\'Copied\'">Copy post</button><a target="_blank" rel="noopener" href="https://www.linkedin.com/feed/"><button style="background:#0a66c2">Open LinkedIn</button></a></div>'}
run();
</script></body></html>
