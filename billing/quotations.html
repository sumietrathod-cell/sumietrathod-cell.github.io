<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations | AAROHAN AI WORLD</title>
<style>*{box-sizing:border-box}body{font:16px/1.55 system-ui;margin:auto;max-width:800px;padding:24px;color:#182823;background:#f4f7f4}section,article{padding:20px;background:white;border-radius:12px;margin:16px 0}label{display:block;margin:8px 0}input,button,select{font:inherit;padding:8px;max-width:100%}button{cursor:pointer}fieldset{margin:.8em 0;border:1px solid #ccd8ce}td,th{text-align:left;padding:.4em}table{width:100%;border-collapse:collapse}#doc{overflow-wrap:anywhere}@media print{body>*:not(#doc),#doc button{display:none}body,#doc{background:white;margin:0;padding:0}}</style>
<header>AAROHAN AI WORLD<h1>Quotations</h1></header>
<form id="login"><label>Email <input name="email" type="email" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Admin sign in</button></form>
<main hidden id="desk"><button id="logout">Sign out</button><section><h2>New quotation</h2><form id="create"><label>Customer <input name="customer" required maxlength="160"></label><div id="lines"></div><button type="button" id="add">Add service</button> <button>Save quotation</button></form></section><section><h2>Latest 100 quotations</h2><select id="history" aria-label="Saved quotations"></select> <button id="open">Open</button></section></main><p role="status" id="msg"></p><article id="doc" hidden></article>
<script>
const base='https://zvrdbekyqbwrztckvkpw.supabase.co', key='sb_publishable_BEBIhj5Y3G5BETK9wFZFVw_URRhizrI';
const $=id=>document.getElementById(id);
let token='', historyRows=[], retryId='', retryData='';
async function api(path, options={}){
 const res=await fetch(base+path,{...options,headers:{apikey:key,Authorization:'Bearer '+(token||key),'Content-Type':'application/json',...options.headers}});
 if(!res.ok){const err=new Error('Request failed ('+res.status+').');err.status=res.status;throw err}
 const t=await res.text();return t?JSON.parse(t):null;
}
const table='/rest/v1/billing_quotations';
async function refresh(){historyRows=await api(table+'?select=id,customer,items,created_at&order=created_at.desc,id.desc&limit=100');$('history').replaceChildren(...historyRows.map((r,i)=>new Option(r.customer+' · '+r.created_at.slice(0,10)+' · '+r.id.slice(0,8),i)));$('open').disabled=!historyRows.length}
function reset(){token='';historyRows=[];retryId='';retryData='';$('history').replaceChildren();$('doc').replaceChildren();$('doc').hidden=true;$('desk').hidden=true;$('login').hidden=false;$('create').reset();$('lines').replaceChildren();addLine()}
$('login').onsubmit=async e=>{e.preventDefault();try{const f=e.target;const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});f.password.value='';if(s.user?.app_metadata?.campaign_manager_role!=='admin')throw Error('Campaign Manager admin access required.');token=s.access_token;await refresh();$('desk').hidden=false;f.hidden=true;$('msg').textContent='Signed in.'}catch(err){reset();$('msg').textContent=err.message}};
$('logout').onclick=async()=>{try{await api('/auth/v1/logout?scope=local',{method:'POST'})}finally{reset();$('msg').textContent='Signed out of this page.'}};
function addLine(){if($('lines').children.length>=50)return;const el=document.createElement('fieldset');el.innerHTML='<label>Service <input name="service" required maxlength="200"></label><label>Quantity <input name="qty" type="number" min="1" max="9999" value="1" required></label><label>Unit price (INR) <input name="price" type="number" min="0" max="9999999.99" step="0.01" required></label><button type="button">Remove service</button>';el.querySelector('button').onclick=()=>{if($('lines').children.length>1)el.remove()};$('lines').append(el)}
$('add').onclick=addLine;addLine();
function view(r){const d=$('doc');d.replaceChildren();function append(tag,value,parent=d){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}
append('p','AAROHAN AI WORLD');append('h2','Quotation');append('p','Reference '+r.id);append('p','Date '+new Date(r.created_at).toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata'}));append('h3',r.customer);
const grid=append('table',''),head=append('tr','',grid);for(const name of ['Service','Qty','Unit price','Amount'])append('th',name,head);
const money=p=>(p/100).toLocaleString('en-IN',{style:'currency',currency:'INR'});let total=0;for(const line of r.items){const amount=line.qty*line.paise;total+=amount;const tr=append('tr','',grid);for(const v of [line.service,line.qty,money(line.paise),money(amount)])append('td',v,tr)}append('h3','Quoted total '+money(total));append('button','Print / Save PDF').onclick=()=>window.print();d.hidden=false;d.scrollIntoView()}
$('open').onclick=()=>{const r=historyRows[$('history').value];if(r)view(r)};
$('create').onsubmit=async e=>{e.preventDefault();let form=e.target,btn=form.querySelector('button:not([type])');btn.disabled=true;try{const customer=form.customer.value.trim(),items=Array.from($('lines').children,el=>({service:el.querySelector('[name=service]').value.trim(),qty:Number(el.querySelector('[name=qty]').value),paise:Math.round(Number(el.querySelector('[name=price]').value)*100)}));const data=JSON.stringify({customer,items});if(data!==retryData){retryId=crypto.randomUUID();retryData=data}let saved;try{[saved]=await api(table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({id:retryId,customer,items})})}catch(err){if(err.status!==409)throw err;[saved]=await api(table+'?id=eq.'+retryId+'&select=id,customer,items,created_at');if(!saved)throw err}
view(saved);form.reset();$('lines').replaceChildren();addLine();retryData='';$('msg').textContent='Quotation saved.';await refresh()}catch(err){$('msg').textContent=err.message}finally{btn.disabled=false}};
</script></html>
