<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations | AAROHAN AI WORLD</title>
<style>*{box-sizing:border-box}body{font:16px/1.55 system-ui;margin:auto;max-width:800px;padding:24px;color:#182823;background:#f4f7f4}section,article{padding:20px;background:white;border-radius:12px;margin:16px 0}label{display:block;margin:8px 0}input,button,select{font:inherit;padding:8px;max-width:100%}button{cursor:pointer}fieldset{margin:.8em 0;border:1px solid #ccd8ce}td,th{text-align:left;padding:.4em}table{width:100%;border-collapse:collapse}#doc{overflow-wrap:anywhere}@media print{#doc thead{display:table-header-group}#doc tr{break-inside:avoid;page-break-inside:avoid}body>*:not(#doc),#doc button{display:none}body,#doc{background:white;margin:0;padding:0}}</style>
<header>AAROHAN AI WORLD<h1>Quotations</h1></header>
<p role="note">Draft billing workspace. This page does not verify GST registration, seller identity, payments or tax requirements. Review documents before providing them to customers.</p>
<form id="login"><label>Email <input name="email" type="email" autocomplete="username" required></label><label>Password <input name="password" type="password" autocomplete="current-password" required></label><button>Admin sign in</button></form>
<main hidden id="desk"><button id="logout">Sign out</button><section><h2>New quotation</h2><form id="create"><label>Customer <input name="customer" required maxlength="160"></label><div id="lines"></div><button type="button" id="add">Add service</button> <button>Save quotation</button></form></section><section><h2>Latest 100 quotations</h2><select id="history" aria-label="Saved quotations"></select> <button id="open">Open</button></section><section><h2>Latest 100 invoices</h2><select id="invoices" aria-label="Saved invoices"></select> <button id="openInvoice">Open invoice</button></section></main><p role="status" id="msg"></p><article id="doc" hidden></article>
<script type="module">
import {buildItems,totalPaise,formatINR,validateCustomer} from './amounts.mjs';
const base='https://zvrdbekyqbwrztckvkpw.supabase.co', key='sb_publishable_BEBIhj5Y3G5BETK9wFZFVw_URRhizrI';
const $=id=>document.getElementById(id);
function replaceContents(element,...children){
 element.textContent='';
 element.append(...children);
}
function quotationId(){
 if(crypto.randomUUID)return crypto.randomUUID();
 const bytes=crypto.getRandomValues(new Uint8Array(16));
 bytes[6]=(bytes[6]&15)|64;
 bytes[8]=(bytes[8]&63)|128;
 const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
 return [hex.slice(0,8),hex.slice(8,12),hex.slice(12,16),hex.slice(16,20),hex.slice(20)].join('-');
}
let token='', historyRows=[], invoiceRows=[], retryId='', retryData='';
let sessionEpoch=0, loginRequest=0, pendingLoginRequest=null, expires=null;
function sameQuotationItems(saved,submitted){
 if(!Array.isArray(saved)||!Array.isArray(submitted)||saved.length!==submitted.length)return false;
 return saved.every((line,i)=>line.service===submitted[i].service &&
  line.qty===submitted[i].qty && line.paise===submitted[i].paise);
}
const current=(expectedToken,expectedEpoch)=>Boolean(expectedToken)&&token===expectedToken&&sessionEpoch===expectedEpoch;
async function api(path, options={}, bearer=token){
 const res=await fetch(base+path,{...options,headers:{apikey:key,Authorization:'Bearer '+(bearer||key),'Content-Type':'application/json',...options.headers}});
 if(!res.ok){
  if(res.status===401&&bearer&&bearer===token){
   reset();$('msg').textContent='Billing session expired. Sign in again.';
  }
  const err=new Error('Request failed ('+res.status+').');err.status=res.status;throw err
 }
 const t=await res.text();return t?JSON.parse(t):null;
}
const table='/rest/v1/billing_quotations';
async function refresh(expectedToken=token,expectedEpoch=sessionEpoch){
 if(!current(expectedToken,expectedEpoch))return;
 const newHistory=await api(table+'?select=id,customer,items,created_at&order=created_at.desc,id.desc&limit=100',{},expectedToken);
 if(!current(expectedToken,expectedEpoch))return;
 const newInvoices=await api('/rest/v1/billing_invoices?select=id,issued_at,billing_quotations(id,created_at,customer,items)&order=issued_at.desc,id.desc&limit=100',{},expectedToken);
 if(!current(expectedToken,expectedEpoch))return;
 historyRows=newHistory;
 invoiceRows=newInvoices;
 replaceContents($('history'),...historyRows.map((r,i)=>new Option(r.customer+' · '+r.created_at.slice(0,10)+' · '+r.id.slice(0,8),i)));
 replaceContents($('invoices'),...invoiceRows.map((r,i)=>new Option(r.billing_quotations.customer+' · '+r.issued_at.slice(0,10)+' · '+r.id.slice(0,8),i)));
 $('open').disabled=!historyRows.length;
 $('openInvoice').disabled=!invoiceRows.length;
}
function reset(){sessionEpoch++;loginRequest++;pendingLoginRequest=null;clearTimeout(expires);expires=null;token='';historyRows=[];invoiceRows=[];replaceContents($('invoices'));retryId='';retryData='';replaceContents($('history'));replaceContents($('doc'));$('doc').hidden=true;$('desk').hidden=true;$('login').hidden=false;$('login').querySelector('button').disabled=false;$('login').querySelector('[name=password]').value='';$('create').reset();replaceContents($('lines'));addLine()}
$('login').onsubmit=async e=>{
 e.preventDefault();
 const form=e.target;
 const credentials=Object.fromEntries(new FormData(form));
 const expectedEpoch=sessionEpoch, request=++loginRequest;
 pendingLoginRequest=request;
 let authenticatedEpoch=null, authenticatedToken='';
 form.querySelector('button').disabled=true;
 try{
  const auth=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(credentials)},key);
  if(expectedEpoch!==sessionEpoch||request!==loginRequest)return;
  if(!auth?.access_token||auth.user?.app_metadata?.campaign_manager_role!=='admin'){
   throw Error('Campaign Manager admin access required.');
  }
  const expiresIn=Number(auth.expires_in);
  if(!Number.isFinite(expiresIn)||expiresIn<=0)throw Error('Invalid session lifetime. Sign in again.');
  token=authenticatedToken=auth.access_token;
  authenticatedEpoch=++sessionEpoch;
  // Enforce the server-issued Auth lifetime; never leave private billing
  // documents on screen after the session is known to be expired.
  expires=setTimeout(()=>{
   if(!current(authenticatedToken,authenticatedEpoch))return;
   reset();$('msg').textContent='Billing session expired. Sign in again.';
  },Math.min(expiresIn*1000,2147483647));
  await refresh(authenticatedToken,authenticatedEpoch);
  if(!current(authenticatedToken,authenticatedEpoch))return;
  $('desk').hidden=false;form.hidden=true;$('msg').textContent='Signed in.';
 }catch(err){
  if(request!==loginRequest)return;
  if(authenticatedEpoch===null ? expectedEpoch!==sessionEpoch :
     !current(authenticatedToken,authenticatedEpoch))return;
  reset();$('msg').textContent=err.message;
 }finally{
  // A late old login must not clear a newer login's typed password or
  // enable its submit button while its request is still in flight.
  if(pendingLoginRequest===request){
   pendingLoginRequest=null;
   form.querySelector('button').disabled=false;
   form.querySelector('[name=password]').value='';
  }
 }
};
$('logout').onclick=async()=>{
 const previousToken=token;
 reset();$('msg').textContent='Signed out of this page.';
 // Clear all account-specific data BEFORE awaiting remote logout. Never
 // revive a previous account's invoices if a request resolves late.
 try{
  if(previousToken) await api('/auth/v1/logout?scope=local',{method:'POST'},previousToken);
 }catch{
  if(!token)$('msg').textContent='Signed out locally. Remote session revocation could not be confirmed.';
 }
};
function addLine(){if($('lines').children.length>=50)return;const el=document.createElement('fieldset');el.innerHTML='<label>Service <input name="service" required maxlength="200"></label><label>Quantity <input name="qty" type="number" min="1" max="9999" value="1" required></label><label>Unit price (INR) <input name="price" type="number" min="0" max="9999999.99" step="0.01" required></label><button type="button">Remove service</button>';el.querySelector('button').onclick=()=>{if($('lines').children.length>1)el.remove()};$('lines').append(el)}
$('add').onclick=addLine;addLine();
function view(r,invoice=null){const d=$('doc');replaceContents(d);function append(tag,value,parent=d){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el}
append('p','AAROHAN AI WORLD');append('h2',invoice?'Service invoice draft':'Quotation');if(invoice)append('p','DRAFT — Not a verified tax invoice. Seller legal details, applicable GST/taxes, payment status and customer terms require review before issue.');append('p','Reference '+(invoice||r).id);if(invoice)append('p','Quotation '+r.id);append('p','Date '+new Date(invoice?.issued_at||r.created_at).toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata'}));append('h3',r.customer);
const grid=append('table',''),head=append('tr','',append('thead','',grid)),body=append('tbody','',grid);for(const name of ['Service','Qty','Unit price','Amount'])append('th',name,head);
const money=formatINR;const total=totalPaise(r.items);for(const line of r.items){const amount=line.qty*line.paise;const tr=append('tr','',body);for(const v of [line.service,line.qty,money(line.paise),money(amount)])append('td',v,tr)}append('h3',(invoice?'Invoice total ':'Quoted total ')+money(total));append('button','Print / Save PDF').onclick=()=>window.print();if(!invoice){
 const issue=append('button','Issue or open invoice');
 issue.onclick=async()=>{
 if(!token)return;
 const expectedToken=token,expectedEpoch=sessionEpoch;
 issue.disabled=true;
 try{
  const response=await api('/rest/v1/rpc/billing_issue_invoice',{method:'POST',body:JSON.stringify({p_quotation_id:r.id})},expectedToken);
  if(!current(expectedToken,expectedEpoch)||!issue.isConnected)return;
  const saved=Array.isArray(response)?response[0]:response;
  if(!saved?.id||saved.quotation_id!==r.id)throw Error('Unexpected invoice response.');
  view(r,saved);$('msg').textContent='Invoice draft ready.';
  await refresh(expectedToken,expectedEpoch);
 }catch(err){if(current(expectedToken,expectedEpoch))$('msg').textContent=err.message}
 finally{issue.disabled=false}
}
 }
 d.hidden=false;d.scrollIntoView()}
$('openInvoice').onclick=()=>{const invoice=invoiceRows[$('invoices').value];if(invoice)view(invoice.billing_quotations,invoice)};
$('open').onclick=()=>{const r=historyRows[$('history').value];if(r)view(r)};
$('create').onsubmit=async e=>{
 e.preventDefault();
 if(!token)return;
 const expectedToken=token,expectedEpoch=sessionEpoch;
 const form=e.target,btn=form.querySelector('button:not([type])');
 btn.disabled=true;
 try{
  const customer=validateCustomer(form.customer.value);
  const items=buildItems(Array.from($('lines').children,el=>({
   service:el.querySelector('[name=service]').value,
   qty:el.querySelector('[name=qty]').value,
   price:el.querySelector('[name=price]').value
  })));
  const data=JSON.stringify({customer,items});
  if(data!==retryData){retryId=quotationId();retryData=data}
  const chosenId=retryId;
  let saved;
  try{
   [saved]=await api(table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({id:chosenId,customer,items})},expectedToken);
  }catch(err){
   if(!current(expectedToken,expectedEpoch)||err.status!==409)throw err;
   [saved]=await api(table+'?id=eq.'+chosenId+'&select=id,customer,items,created_at',{},expectedToken);
  }
  if(!current(expectedToken,expectedEpoch))return;
  if(!saved||saved.id!==chosenId||saved.customer!==customer||!sameQuotationItems(saved.items,items)){
   throw Error('Saved quotation did not match the submitted request.');
  }
  view(saved);
  form.reset();replaceContents($('lines'));addLine();retryData='';
  $('msg').textContent='Quotation saved.';
  await refresh(expectedToken,expectedEpoch);
 }catch(err){if(current(expectedToken,expectedEpoch))$('msg').textContent=err.message}
 finally{btn.disabled=false}
};
</script></html>
