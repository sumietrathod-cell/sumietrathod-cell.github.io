<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net blob:; worker-src blob: https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>PDF reader</title><style>*{box-sizing:border-box}body{background:#172338;color:#edf6ff;font:15px/1.5 system-ui;margin:0;padding:16px}label{display:block;margin:12px 0 6px}textarea,input{width:100%;padding:10px;background:#101a2d;color:#edf6ff;border:1px solid #7586a2;border-radius:9px;font:inherit}button{padding:10px 14px;border-radius:10px;border:0;background:#b5f7e5;color:#112b32;font:600 15px system-ui;margin:10px 5px 8px 0}button:disabled{opacity:.5}small{color:#b9cce3}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><label for="file">Fictional PDF (maximum 5 MB / 30 pages)</label><input id="file" type="file" accept=".pdf,application/pdf"><button id="extract">Extract text</button><p id="status" role="status">Ready. Scanned PDF OCR is not supported.</p><label for="text">Extracted text — review against original</label><textarea id="text" rows="8" readonly></textarea><label for="q">Approved sample question</label><input id="q" maxlength="180"><label for="a">Approved sample answer (use verified source text)</label><textarea id="a" rows="3" maxlength="500"></textarea><button id="add">Add FAQ</button><button id="export">Download FAQ CSV</button><button id="clear">Clear workshop</button><p id="count" role="status">0 FAQ entries</p><pre id="list"></pre><small>Manual review is required. No automatic AI training or medical advice.</small><script type="module">
const $=id=>document.getElementById(id), entries=[];let loading=false;const status=t=>$("status").textContent=t;function render(){$("count").textContent=entries.length+" FAQ entries";$("list").textContent=entries.map((x,i)=>(i+1)+". "+x.question+"\n"+x.answer).join("\n\n")};$("extract").onclick=async()=>{if(loading)return;const file=$("file").files[0];if(!file||!/\.pdf$/i.test(file.name)||file.size>5242880){status("Choose a PDF no larger than 5 MB.");return}loading=true;$("extract").disabled=$("clear").disabled=true;$("text").value="";let task;try{status("Loading PDF reader…");const pdfjs=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.min.mjs");pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.5.438/build/pdf.worker.min.mjs";task=pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false,useSystemFonts:false,disableFontFace:true});const doc=await task.promise;if(doc.numPages>30)throw Error("PDF must contain 30 pages or fewer.");let out="";for(let n=1;n<=doc.numPages;n++){const page=await doc.getPage(n),content=await page.getTextContent();out+="--- Page "+n+" ---\n"+content.items.map(i=>typeof i.str==="string"?i.str+(i.hasEOL?"\n":" "):"").join("")+"\n\n";if(out.length>100000)throw Error("Extracted text exceeds 100,000 characters.");page.cleanup()}$("text").value=out;status("Extraction complete. Verify text and reading order. Scanned pages may be empty.")}catch(e){status("PDF extraction unavailable: "+(e.message||"unknown error")+". You can still enter sample FAQ manually.")}finally{try{if(task)await task.destroy()}catch(e){}loading=false;$("extract").disabled=$("clear").disabled=false}};$("add").onclick=()=>{const question=$("q").value.trim(),answer=$("a").value.trim();if(!question||!answer||entries.length>=100){status("Enter a question and answer. Maximum 100 entries.");return}entries.push({question,answer});$("q").value=$("a").value="";render();status("Sample FAQ added.")};$("export").onclick=()=>{if(!entries.length){status("Add at least one FAQ first.");return}const quote=v=>'"'+(/^[\s\u0000-\u001f]*[=+@-]/.test(v)?"'"+v:v).replaceAll('"','""')+'"';const csv="\uFEFFquestion,answer\r\n"+entries.map(e=>[e.question,e.answer].map(quote).join(",")).join("\r\n");const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="prism-pdf-faq.csv";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)};$("clear").onclick=()=>{entries.length=0;$("file").value=$("text").value=$("q").value=$("a").value="";render();status("Cleared.")};render();
</script></body></html>
