name: Mobile business card and ticket check
on:
  push:
    branches: [qa/business-card-support-mobile]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node qa/card-support-check.cjs
