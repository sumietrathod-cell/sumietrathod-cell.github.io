name: Campaign Manager checks

on:
  pull_request:
    paths:
      - "campaign-manager/**"
      - "supabase/**"
      - "campaign-manager-dashboard.html"
      - "scripts/check-campaign-dashboard.mjs"
      - "scripts/check-campaign-permissions.mjs"
      - "scripts/check-campaign-queue.mjs"
      - ".github/workflows/campaign-manager-check.yml"
  push:
    branches:
      - feature/aarohan-campaign-manager-demo
    paths:
      - "campaign-manager/**"
      - "supabase/**"
      - "campaign-manager-dashboard.html"
      - "scripts/check-campaign-dashboard.mjs"
      - "scripts/check-campaign-permissions.mjs"
      - "scripts/check-campaign-queue.mjs"
      - ".github/workflows/campaign-manager-check.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/campaign-api/index.ts
      - name: Verify synthetic CRM preview eligibility cases
        run: deno test supabase/functions/campaign-api/preview-eligibility.test.ts
      - name: Parse PostgreSQL schema and policy SQL
        run: |
          python -m pip install --disable-pip-version-check sqlfluff
          for file in campaign-manager/supabase/preflight.sql campaign-manager/supabase/schema.sql campaign-manager/supabase/rls-policies.sql campaign-manager/supabase/migrations/20261117_tenant_integrity.sql campaign-manager/supabase/migrations/20261123_suppression_idempotency.sql campaign-manager/supabase/queue-worker.sql; do
            sqlfluff parse --dialect postgres "$file"
          done
      - name: Check dashboard script and DOM references
        run: node scripts/check-campaign-dashboard.mjs
      - name: Check permission RLS and immutable opt-outs
        run: node --test scripts/check-campaign-permissions.mjs
      - name: Check stale-claim quarantine does not automatically resend
        run: node --test scripts/check-campaign-queue.mjs

  tenant-rls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable-postgres
          POSTGRES_DB: aarohan_campaign_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d aarohan_campaign_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-only-disposable-postgres
      PGDATABASE: aarohan_campaign_ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Prepare disposable Auth fixtures and actual tenant RLS policies
        run: |
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/ci-auth-bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/preflight.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/schema.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/migrations/20261123_suppression_idempotency.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/rls-policies.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/queue-worker.sql
          # Mimic the Supabase Data API role privileges. RLS still controls rows.
          psql -X -v ON_ERROR_STOP=1 -c "grant select, insert, update, delete on all tables in schema public to authenticated;"
          psql -X -v ON_ERROR_STOP=1 -c "grant usage, select on all sequences in schema public to authenticated;"
      - name: Real PostgreSQL two-tenant RLS and opt-out tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/campaign-access.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/tenant-permissions-ci.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/tenant-enrollment-ci.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/tenant-contact-identity-ci.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/tenant-history-retention-ci.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/tenant-suppression-idempotency-ci.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/tenant-audit-integrity-ci.sql
      - name: Actual PostgreSQL synthetic queue safety tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/queue-claim-eligibility.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/queue-quarantine.sql
          psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/queue-active-uniqueness-ci.sql

      - name: Seed fictional contact data for real HTTP tenant tests
        run: psql -X -v ON_ERROR_STOP=1 -f campaign-manager/supabase/tests/ci-rest-fixtures.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actual authenticated PostgREST HTTP/RLS checks (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          # A newly generated test-only signing key. No real Supabase JWT,
          # service key, live customer credential or outbound provider in CI.
          export PGRST_JWT_SECRET="$(openssl rand -hex 32)"
          docker run --rm -d --name aarohan-pgrst-ci --network host \
            -e PGRST_DB_URI="postgres://postgres:ci-only-disposable-postgres@127.0.0.1:5432/aarohan_campaign_ci" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_SERVER_PORT=3000 \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            postgrest/postgrest:v14.18
          trap 'docker logs aarohan-pgrst-ci --tail 30 || true; docker rm -f aarohan-pgrst-ci >/dev/null 2>&1 || true' EXIT
          # curl's exit status is zero for HTTP 503 too. PostgREST can
          # accept TCP requests before its schema cache has finished loading.
          # An unauthenticated /contacts request should return 401/403 once
          # the API is actually ready; 200 is also "ready" so the later test
          # can independently fail if anonymous access is mistakenly allowed.
          ready=0
          for attempt in $(seq 1 40); do
            status="$(curl --silent --output /dev/null --max-time 2 \
              --write-out '%{http_code}' 'http://127.0.0.1:3000/contacts?select=id' || true)"
            if [[ "$status" == "401" || "$status" == "403" || "$status" == "200" ]]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "PostgREST schema cache not ready after bounded retries"
            exit 1
          fi
          node scripts/check-campaign-postgrest.mjs
