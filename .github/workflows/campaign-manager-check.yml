name: Campaign Manager checks

on:
  pull_request:
    paths:
      - "campaign-manager/**"
      - "supabase/**"
      - "campaign-manager-dashboard.html"
      - "scripts/check-campaign-dashboard.mjs"
      - "scripts/check-campaign-permissions.mjs"
      - ".github/workflows/campaign-manager-check.yml"
  push:
    branches:
      - feature/aarohan-campaign-manager-demo
    paths:
      - "campaign-manager/**"
      - "supabase/**"
      - "campaign-manager-dashboard.html"
      - "scripts/check-campaign-dashboard.mjs"
      - "scripts/check-campaign-permissions.mjs"
      - ".github/workflows/campaign-manager-check.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Type-check Supabase Edge Function
        run: deno check supabase/functions/campaign-api/index.ts
      - name: Parse PostgreSQL schema and policy SQL
        run: |
          python -m pip install --disable-pip-version-check sqlfluff
          for file in campaign-manager/supabase/preflight.sql campaign-manager/supabase/schema.sql campaign-manager/supabase/rls-policies.sql campaign-manager/supabase/migrations/20261117_tenant_integrity.sql campaign-manager/supabase/queue-worker.sql; do
            sqlfluff parse --dialect postgres "$file"
          done
      - name: Check dashboard script and DOM references
        run: node scripts/check-campaign-dashboard.mjs
      - name: Check permission RLS and immutable opt-outs
        run: node --test scripts/check-campaign-permissions.mjs
