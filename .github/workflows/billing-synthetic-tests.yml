name: Billing synthetic tests
on:
  push:
    branches:
      - feature/billing-readonly-overview-20261123
    paths:
      - 'billing/**'
      - 'tests/billing-*.test.mjs'
      - '.github/workflows/billing-synthetic-tests.yml'
  pull_request:
    paths:
      - 'billing/**'
      - 'tests/billing-*.test.mjs'
      - '.github/workflows/billing-synthetic-tests.yml'
permissions:
  contents: read
jobs:
  billing-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run billing synthetic tests
        run: node --test tests/billing-*.test.mjs
