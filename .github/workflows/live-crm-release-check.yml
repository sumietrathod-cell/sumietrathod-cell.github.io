name: Live CRM release safety
on:
  pull_request:
    paths:
      - 'campaign-manager.html'
      - 'tests/live-crm-signout.test.mjs'
      - 'tests/live-crm-login.test.mjs'
      - '.github/workflows/live-crm-release-check.yml'
  push:
    branches:
      - fix/live-crm-safe-signout-20261123
      - main
    paths:
      - 'campaign-manager.html'
      - 'tests/live-crm-signout.test.mjs'
      - 'tests/live-crm-login.test.mjs'
      - '.github/workflows/live-crm-release-check.yml'
permissions:
  contents: read
jobs:
  live-crm-safe-signout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse login and logout regression test modules
        run: |
          node --check tests/live-crm-signout.test.mjs
          node --check tests/live-crm-login.test.mjs
      - name: Test sign-in, sign-out, stale session and rejected Auth response
        run: node --test tests/live-crm-*.test.mjs
