name: CRM contact history verification
on:
  push:
    branches: [qa/crm-contact-history]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node qa/crm-contacts.cjs
