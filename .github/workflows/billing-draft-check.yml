name: Billing draft safety checks
on:
  pull_request:
    paths:
      - 'billing/**'
      - '.github/workflows/billing-draft-check.yml'
  push:
    branches:
      - feature/billing-quotation-validation-20261123
    paths:
      - 'billing/**'
      - '.github/workflows/billing-draft-check.yml'
permissions:
  contents: read
jobs:
  validate-billing-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check standalone billing amount module
        run: node --check billing/amounts.mjs
      - name: Validate money arithmetic and legal-draft contract
        run: node --test billing/tests/*.test.mjs
