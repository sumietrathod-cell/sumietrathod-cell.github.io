name: Aarohi mobile demo verification
on:
  push:
    branches: [qa/aarohi-live-20261120]
    paths: ['.github/workflows/aarohi-demo.yml']
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: node qa/aarohi-live.cjs
