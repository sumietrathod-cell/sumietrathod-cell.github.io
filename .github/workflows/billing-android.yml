name: Android billing print verification
on:
  push:
    branches: [qa/billing-mobile-print]
    paths: ['.github/workflows/billing-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare Android billing test
        run: |
          sudo chmod 666 /dev/kvm
          python -m venv /tmp/android-billing
          /tmp/android-billing/bin/pip -q install playwright==1.56.0 pypdf==6.1.3
          cat > /tmp/android-billing/run.py <<'PY'
          import json
          import shutil
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader
          
          import subprocess, time, re, xml.etree.ElementTree as ET
          
          def adb(*args):
              return subprocess.check_output(["adb",*args],text=True).strip()
          def nodes():
              adb("shell","uiautomator","dump","/sdcard/ui.xml")
              return list(ET.fromstring(adb("shell","cat","/sdcard/ui.xml")).iter("node"))
          def touch(n):
              a,b,c,d=map(int,re.findall(r"\d+",n.attrib["bounds"]))
              adb("shell","input","tap",str((a+c)//2),str((b+d)//2))
          def press_if(matches,attempts):
              for _ in range(attempts):
                  found=nodes()
                  for n in found:
                      if matches(n.attrib):
                          touch(n)
                          return True
                  time.sleep(1)
              print([(n.get('resource-id'),n.get('text'),n.get('content-desc')) for n in found if n.get('clickable')=='true'],flush=True)
              return False
          
          adb("shell","am","start","-a","android.intent.action.VIEW","-d","about:blank","com.android.chrome")
          time.sleep(3)
          for _ in range(4):
              if not press_if(lambda a:a.get("text","").lower() in ("accept & continue","use without an account","no thanks","continue without an account","got it"),1):
                  break
          adb("forward","tcp:9222","localabstract:chrome_devtools_remote")
          
          quotes, invoices = [], []
          def reply(route):
              req = route.request
              path = req.url.split("?")[0]
              if path.endswith("/token"):
                  result = {"access_token":"synthetic","user":{"app_metadata":{"campaign_manager_role":"admin"}}}
              elif path.endswith("/billing_quotations"):
                  if req.method == "POST":
                      quotes.append(dict(req.post_data_json, created_at="2026-11-20T00:00:00Z"))
                  result = quotes
              elif path.endswith("/billing_invoices"):
                  result = invoices
              elif path.endswith("/billing_issue_invoice"):
                  assert req.post_data_json["p_quotation_id"] == quotes[0]["id"]
                  if not invoices:
                      invoices.append({"id":"demo-invoice","issued_at":"2026-11-20T00:00:00Z","billing_quotations":quotes[0]})
                  result = invoices[0]
              else:
                  return route.abort()
              route.fulfill(json=result)
          with sync_playwright() as pw:
              browser = pw.chromium.connect_over_cdp("http://127.0.0.1:9222")
              page = browser.contexts[0].new_page()
              page.route("https://*.supabase.co/**",reply)
              response = page.goto("https://aarohanaiworld.com/billing/quotations.html")
              assert response.ok
              page.get_by_label("Email",exact=True).fill("demo@example.invalid")
              page.get_by_label("Password").fill("synthetic")
              page.get_by_text("Admin sign in").click()
              page.get_by_label("Customer",exact=True).fill("Mobile QA")
              page.get_by_label("Service",exact=True).fill("Setup")
              page.get_by_label("Quantity").fill("2")
              page.get_by_label("Unit price (INR)").fill("15")
              page.get_by_text("Add service",exact=True).click()
              page.get_by_label("Service",exact=True).last.fill("Support")
              page.get_by_label("Unit price (INR)").last.fill("5")
              page.get_by_text("Save quotation",exact=True).click()
              page.get_by_text("Quoted total ₹35.00").wait_for()
              page.get_by_text("Open",exact=True).click()
              page.get_by_text("Issue or open invoice").click()
              page.get_by_text("Invoice total ₹35.00").wait_for()
              page.get_by_text("Open invoice",exact=True).click()
              assert page.evaluate("document.documentElement.scrollWidth <= innerWidth")
              page.get_by_text("Print / Save PDF").click(no_wait_after=True)
              assert press_if(lambda a:a.get("resource-id","").endswith("/print_button") or a.get("content-desc","").lower() in ("save as pdf","save to pdf","save"),12), "Android print button unavailable"
              assert press_if(lambda a:a.get("text","").upper()=="SAVE" and a.get("clickable")=="true",12), "Android file picker unavailable"
              for _ in range(15):
                  paths=adb("shell","find","/sdcard/Download","-iname","*.pdf").splitlines()
                  if paths: break
                  time.sleep(1)
              assert len(paths)==1, "Expected one saved PDF"
              adb("pull",paths[0],"demo.pdf")
              content=" ".join(p.extract_text() for p in PdfReader("demo.pdf").pages)
              for s in ("Setup","Support","35.00","Mobile QA","demo-invoice"):
                  assert s in content, s
              assert "Sign out" not in content
              print("Verified Android native print and PDF contents.",flush=True)
          PY
      - name: Save and reopen invoice PDF on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis_playstore
          disable-animations: true
          script: /tmp/android-billing/bin/python /tmp/android-billing/run.py
