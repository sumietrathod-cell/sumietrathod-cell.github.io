name: Android billing print verification
on:
  push:
    branches: [qa/billing-mobile-print]
    paths: ['.github/workflows/billing-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare Android billing test
        run: |
          sudo chmod 666 /dev/kvm
          python -m venv /tmp/android-billing
          /tmp/android-billing/bin/pip -q install websocket-client==1.8.0 playwright==1.56.0 pypdf==6.1.3
          cat > /tmp/android-billing/run.py <<'PY'
          import json
          import shutil
          from playwright.sync_api import sync_playwright
          from pypdf import PdfReader
          
          import subprocess, time, re, xml.etree.ElementTree as ET
          
          def adb(*args):
              return subprocess.check_output(["adb",*args],text=True).strip()
          def nodes():
              adb("shell","uiautomator","dump","/sdcard/ui.xml")
              return list(ET.fromstring(adb("shell","cat","/sdcard/ui.xml")).iter("node"))
          def touch(n):
              a,b,c,d=map(int,re.findall(r"\d+",n.attrib["bounds"]))
              adb("shell","input","tap",str((a+c)//2),str((b+d)//2))
          def press_if(matches,attempts):
              for _ in range(attempts):
                  found=nodes()
                  for n in found:
                      if matches(n.attrib):
                          touch(n)
                          return True
                  time.sleep(1)
              print([(n.get('resource-id'),n.get('text'),n.get('content-desc')) for n in found if n.get('clickable')=='true'],flush=True)
              return False
          
          adb("shell","wm","size","1080x1920")
          adb("shell","wm","density","360")
          adb("shell","am","start","-a","android.intent.action.VIEW","-d","about:blank","com.android.chrome")
          time.sleep(3)
          for _ in range(4):
              if not press_if(lambda a:a.get("text","").lower() in ("accept & continue","use without an account","no thanks","continue without an account","got it"),1):
                  break
          adb("forward","tcp:9222","localabstract:chrome_devtools_remote")
          
          import urllib.request, websocket
          targets=json.load(urllib.request.urlopen("http://127.0.0.1:9222/json"))
          target=next(t for t in targets if t["type"]=="page")
          ws=websocket.create_connection(target["webSocketDebuggerUrl"],suppress_origin=True,timeout=20)
          seq=0
          def cmd(method,params):
              global seq
              seq+=1
              ws.send(json.dumps(dict(id=seq,method=method,params=params)))
              while True:
                  m=json.loads(ws.recv())
                  if m.get("id")==seq:
                      assert "error" not in m,m.get("error")
                      return m["result"]
          def js(expr):
              res=cmd("Runtime.evaluate",dict(expression=expr,returnByValue=True,userGesture=True))
              assert "exceptionDetails" not in res,res.get("exceptionDetails")
              return res["result"].get("value")
          cmd("Page.navigate",{"url":"https://aarohanaiworld.com/billing/quotations.html?release=fcb4908"})
          for _ in range(45):
              if js("typeof quotationId==='function'"): break
              time.sleep(1)
          assert js("typeof quotationId==='function' && /^[a-f0-9-]{36}$/.test(quotationId())"),js("document.title")
          js("""view({id:'sample-quote',customer:'Mobile QA',items:[{service:'Setup',qty:2,paise:1500},{service:'Support',qty:1,paise:500}]},{id:'demo-invoice',issued_at:'2026-11-20T00:00:00Z'})""")
          assert js("document.querySelector('#doc').textContent.includes('35.00')")
          js("document.querySelector('#doc button').scrollIntoView({block:'center'})")
          x,y=js("(()=>{const r=document.querySelector('#doc button').getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]})()")
          for action in ("mousePressed","mouseReleased"):
              cmd("Input.dispatchMouseEvent",dict(type=action,x=x,y=y,button="left",clickCount=1))
          assert press_if(lambda a:a.get("resource-id","").endswith("/destination_spinner"),10)
          assert press_if(lambda a:"save as pdf" in (a.get("text","")+" "+a.get("content-desc","")).lower(),8)
          print([(n.get("resource-id"),n.get("text"),n.get("content-desc")) for n in nodes()],flush=True)
          assert press_if(lambda a:a.get("resource-id","").endswith(("/print_button","/print_button_icon","/print_button_container")) or a.get("content-desc","").lower() in ("save as pdf","save to pdf","save"),12), "Android print button unavailable"
          assert press_if(lambda a:a.get("text","").upper()=="SAVE" and a.get("clickable")=="true",12), "Android file picker unavailable"
          for _ in range(15):
              paths=adb("shell","find","/sdcard/Download","-iname","*.pdf").splitlines()
              if paths: break
              time.sleep(1)
          assert len(paths)==1, "Expected one saved PDF"
          from pathlib import Path
          for _ in range(60):
              adb("pull",paths[0],"demo.pdf")
              if b"%%EOF" in Path("demo.pdf").read_bytes()[-1024:]: break
              time.sleep(1)
          content=" ".join(p.extract_text() for p in PdfReader("demo.pdf").pages)
          for s in ("Setup","Support","35.00","Mobile QA","demo-invoice"):
              assert s in content, s
          assert "Sign out" not in content
          print("Verified Android native print and PDF contents.",flush=True)
          PY
      - name: Save and reopen invoice PDF on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis_playstore
          disable-animations: true
          script: /tmp/android-billing/bin/python /tmp/android-billing/run.py
