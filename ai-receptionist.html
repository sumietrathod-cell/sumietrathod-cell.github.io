form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
input{flex:1;min-width:0;padding:12px 15px;border:1px solid #cdd6e3;border-radius:99px;font-size:15px;outline:0}
input:focus{border-color:var(--navy)}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:var(--navy);font-size:20px;cursor:pointer;flex:none}
.mic.rec{background:#dc2626;color:#fff;animation:pl 1s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.08)}}

function detect(t){
 if(/[઀-૿]/.test(t))return 'gu';
 if(/[ऀ-ॿ]/.test(t))return 'hi';
 var l=' '+t.toLowerCase()+' ';
 if(/\s(che|chhe|shu|su|mare|maru|tame|tamaru|joie|joiye|kem|ketla|nathi)\s/.test(l))return 'gu';
 if(/\s(hai|kya|mujhe|chahiye|kaise|kitna|aap|mera|nahi|hain)\s/.test(l))return 'hi';
 return 'en';
}
function has(t,list){t=t.toLowerCase();for(var i=0;i<list.length;i++){if(t.indexOf(list[i])>=0)return true}return false}
function fill(s){return s.replace('{n}',lead.name||'').replace('{p}',lead.phone||'')}

function add(cls,text){var d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function say(key,lang){var s=fill(T[key][lang]);add('b',s);speak(s,lang)}

function speak(s,lang){
 if(!speakOn||!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s.replace(/•/g,''));var code=lang==='gu'?'gu-IN':lang==='hi'?'hi-IN':'en-IN';u.lang=code;
  var vs=speechSynthesis.getVoices(),v=null;for(var i=0;i<vs.length;i++){if(vs[i].lang.replace('_','-')===code){v=vs[i];break}}
  if(!v)for(i=0;i<vs.length;i++){if(vs[i].lang.indexOf(code.slice(0,2))===0){v=vs[i];break}}
  if(v)u.voice=v;u.onstart=function(){orb.classList.add('on')};u.onend=u.onerror=function(){orb.classList.remove('on')};speechSynthesis.speak(u)}catch(e){}
}

function grabLead(t){
 var digits=t.replace(/[^\d૦-૯०-९]/g,'').replace(/[૦-૯]/g,function(c){return c.charCodeAt(0)-0x0AE6}).replace(/[०-९]/g,function(c){return c.charCodeAt(0)-0x0966});
 if(digits.length>=10&&digits.length<=13&&!lead.phone)lead.phone=digits.length>10?'+'+digits:digits;
 var m=t.match(/(?:my name is|i am|i'm|this is|mera naam|maru naam|મારું નામ|મારુ નામ|मेरा नाम)\s*[:,-]?\s*([^\d,.!?\n]{2,40})/i);
 if(m&&!lead.name)lead.name=m[1].replace(/\s+(che|chhe|hai|છે|है)\s*$/i,'').replace(/\s+(અને|और|and)\s*$/i,'').trim();
}

function showLead(lang){
 leadShown=true;
 var msg='New enquiry from Aarohi (AI Receptionist)\nName: '+lead.name+'\nWhatsApp: '+lead.phone+'\nInterest: '+(lead.need||'-')+'\nLanguage: '+lang;
 var d=document.createElement('div');d.className='lead';
 var b=document.createElement('b');b.textContent='📋 '+lead.name+' · '+lead.phone;d.appendChild(b);
 var p=document.createElement('div');p.textContent='Interest: '+(lead.need||'-');d.appendChild(p);
 var a=document.createElement('a');a.className='cta';a.target='_blank';a.rel='noopener';a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);a.textContent='WhatsApp પર મોકલો ↗';d.appendChild(a);
 log.appendChild(d);log.scrollTop=log.scrollHeight;
}

 var topic=has(t,K.pharma)?'pharma':has(t,K.biz)?'biz':has(t,K.studio)?'studio':'';
 if(topic&&!lead.need)lead.need=topic==='pharma'?'Pharma QA agents':topic==='biz'?'Business agents':'AI Agent Studio';

 if(askedLead&&!leadShown){
  if(!lead.name&&!/\d/.test(t)&&t.trim().split(/\s+/).length<=4&&!topic&&!has(t,K.price))lead.name=t.trim();
  if(lead.name&&lead.phone){say('done',lang);showLead(lang);return}
  if(lead.phone&&!lead.name){say('askName',lang);return}
  if(lead.name&&!lead.phone){say('askPhone',lang);return}
 }
 if(lead.name&&lead.phone&&!leadShown){say('done',lang);showLead(lang);return}

 var key=has(t,K.thanks)&&t.length<30?'thanks':has(t,K.custom)?'custom':has(t,K.price)?'price':has(t,K.trial)?'trial':topic||(has(t,K.data)?'data':has(t,K.buy)?'buy':'unknown');
 if(key==='buy'){askedLead=true;say('askLead',lang);return}
 say(key,lang);
 if(!askedLead&&!leadShown&&(turns>=2||key==='price')&&key!=='thanks'){askedLead=true;setTimeout(function(){say('askLead',lang)},speakOn?300:0)}
}

});
