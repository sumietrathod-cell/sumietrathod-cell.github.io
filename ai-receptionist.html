*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans Gujarati","Shruti",Arial,sans-serif;background:var(--bg);color:var(--ink)}

select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
.tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--ink)}

.m{max-width:88%;padding:11px 15px;border-radius:16px;font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.b{background:#f1f4f9;align-self:flex-start;border-bottom-left-radius:4px}
.u{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}

.qr button:hover{background:var(--navy);color:#fff}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
input{flex:1;min-width:0;padding:12px 15px;border:1px solid #cdd6e3;border-radius:99px;font-size:15px;outline:0}
input:focus{border-color:var(--navy)}
.tg.echo-on{background:var(--navy);color:#fff;border-color:var(--navy)}
#inst{display:none}
.mic{width:48px;height:48px;border-radius:50%;border:0;background:var(--gold);color:var(--navy);font-size:20px;cursor:pointer;flex:none}
.mic.rec{background:#dc2626;color:#fff;animation:pl 1s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.08)}}

function detect(t){
 if(/[઀-૿]/.test(t))return 'gu';
 if(/[ऀ-ॿ]/.test(t))return 'hi';
 var l=' '+t.toLowerCase().replace(/[^a-z0-9 ]+/g,' ')+' ';
 var g=(l.match(/\s(che|chhe|chhu|chu|shu|su|mare|maru|mari|mane|tame|tamaru|tamari|joie|joiye|kem|ketla|ketlu|nathi|kevi|kevu|rite|vaparvu|vaparvo|vapru|banavu|banavvu|banavvi|lidho|lidhu|lidhi|maltu|malse|chalti|chaltu|karvo|karvu|karu|lavu|aavyu|thay|thayu|thai|gayu|gayo|kyare|amare|apo|aapo|nu|ni|no|ma)\s/g)||[]).length;
 var h=(l.match(/\s(hai|hain|kya|mujhe|mujhko|chahiye|kaise|kitna|kitne|aap|mera|meri|mere|nahi|nahin|karun|karu|raha|rahi|rahe|kyu|kab|hoga|milega|batao|bataiye|kijiye|ka|ki|ke|se|ko)\s/g)||[]).length;
 if(g>h&&g>0)return 'gu';
 if(h>g&&h>0)return 'hi';
 return 'en';
}
function has(t,list){t=t.toLowerCase();for(var i=0;i<list.length;i++){if(t.indexOf(list[i])>=0)return true}return false}

function reply(t){
 if(!t.trim())return;
 add('u',t);turns++;
 var lang=/[A-Za-z઀-૿ऀ-ॿ]/.test(t.replace(/[૦-૯०-९]/g,''))?detect(t):lastLang;
 if(lang==='en'&&askedLead&&!leadShown&&t.trim().split(/\s+/).length<=3&&!/\b(my|name|is|the|and|i)\b/i.test(t))lang=lastLang;
 lastLang=lang;
 var hadPhone=!!lead.phone,hadName=!!lead.name;
 grabLead(t);
 var gotLeadInfo=(lead.phone&&!hadPhone)||(lead.name&&!hadName);
 var topic=has(t,K.pharma)?'pharma':has(t,K.biz)?'biz':has(t,K.studio)?'studio':'';
 if(topic&&!lead.need)lead.need=topic==='pharma'?'Pharma QA agents':topic==='biz'?'Business agents':'AI Agent Studio';
 var found=has(t,K.custom)?[]:findAgents(t);
 var sup=findSupport(t),use=usageAsked(t);
 if(use)isCustomer=/lidh|kharid|bought|purchas|લીધ|ખરીદ્ય|खरीदा|लिया/i.test(t)||isCustomer;
 if(sup&&!gotLeadInfo){var sd=add('b',sup[lang]);speak(sup[lang],lang);return}
 var dashOnly=/dashboard|ડેશબોર્ડ|डैशबोर्ड/i.test(t)&&(!found.length||found[0].s<=3);
 if(use&&!gotLeadInfo){if(dashOnly)explainDashboards(lang);else if(found.length)explainUsage(found,lang,t);else if(/dashboard|ડેશબોર્ડ|डैशबोर्ड/i.test(t))explainDashboards(lang);else explainGeneral(lang);return}

 // a short plain reply right after we asked for the name is taken as the name
 if(askedLead&&!leadShown&&!lead.name&&!gotLeadInfo&&!found.length&&!/[\d?]/.test(t)&&!intentWord(t)){
  var w=t.trim().replace(/[.!,]+$/,'');
  if(w.split(/\s+/).length<=3&&!GREET.test(w)&&w.length>=2){lead.name=w;gotLeadInfo=true}
 }
 if(gotLeadInfo&&!leadShown&&!found.length){nextLeadStep(lang);return}

 if(found.length){explainAgents(found,lang);
  if(!askedLead&&!leadShown&&!isCustomer&&turns>=2){askedLead=true;setTimeout(function(){say('askLead',lang)},300)}return}
 var key=has(t,K.thanks)&&t.length<30?'thanks':has(t,K.custom)?'custom':has(t,K.price)?'price':has(t,K.trial)?'trial':topic||(has(t,K.data)?'data':has(t,K.buy)?'buy':GREET.test(t.trim())?'hello':'unknown');
 if(key==='buy'){askedLead=true;nextLeadStep(lang);return}
 say(key,lang);
 if(!askedLead&&!leadShown&&!isCustomer&&(turns>=2||key==='price')&&key!=='thanks'&&key!=='hello'){askedLead=true;setTimeout(function(){say('askLead',lang)},300)}
}
