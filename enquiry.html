<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Send an enquiry | AAROHAN AI WORLD</title>
<link rel="stylesheet" href="voice-platform/studio.css">
</head>
<body>
<header><a class="brand" href="./">AAROHAN AI WORLD</a></header>
<main>
<h1 id="enquiry-title">Send an enquiry</h1>
<form class="card stack" id="enquiry" method="post">
  <label>Your name<input id="enquiry-name" maxlength="120" autocomplete="name" required></label>
  <label>Business email<input id="enquiry-email" type="email" maxlength="254" autocomplete="email" required></label>
  <label>Business name<input id="enquiry-company" maxlength="200" autocomplete="organization"></label>
  <label>How can we help?<textarea id="enquiry-message" maxlength="2000" required></textarea></label>
  <label><input id="enquiry-consent" type="checkbox" required> I agree that AAROHAN AI WORLD can use these details to respond to my enquiry.</label>
  <div><button type="submit" disabled>Send enquiry</button></div>
  <p class="status" id="enquiry-status" role="status"></p>
  <a href="aiworld/privacy.html">Privacy</a>
</form>
</main>
<script type="module">
const form = document.querySelector('#enquiry');
const button = form.querySelector('button');
const output = document.querySelector('#enquiry-status');
const channel = new URLSearchParams(location.search).get('channel') === 'voice' ? 'voice' : 'chatbot';
if (channel === 'voice') document.querySelector('#enquiry-title').textContent = 'Request an Aarohi follow-up';
const demoParams = new URLSearchParams(location.search);
const shopNames = new Map([['clothing','clothing shop'],['grocery','grocery shop'],['electronics','electronics shop'],['pharmacy','medical store']]);
const topics = new Map([['stock','stock enquiries'],['price','pricing enquiries'],['pickup','collection requests']]);
const shopName = shopNames.get(demoParams.get('shop'));
const topicName = topics.get(demoParams.get('topic'));
if (channel === 'chatbot' && shopName && topicName) {
  document.getElementById('enquiry-message').value = 'I would like a chatbot demo for my ' + shopName + ' that handles ' + topicName + '.';
}
const fields = ['enquiry-name','enquiry-email','enquiry-company','enquiry-message','enquiry-consent'].map(id => document.getElementById(id));
let pending = false;
function buildEnquiry() {
  const [name,email,company,message,consent] = fields;
  return {channel, name:name.value.trim(), email:email.value.trim(), company:company.value.trim(), message:message.value.trim(), consent:consent.checked};
}
function validEnquiry(p) {
  return p.consent === true && ['voice','chatbot'].includes(p.channel) &&
    p.name.length > 0 && p.name.length <= 120 && p.email.length <= 254 &&
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email) &&
    p.company.length <= 200 && p.message.length > 0 && p.message.length <= 2000 &&
    [p.name,p.email,p.company,p.message].every(s => !s.includes('\0'));
}
function setStatus(message,error=false) {
  output.textContent = message;
  output.dataset.error = String(error);
}
async function submitEnquiry(event) {
  event.preventDefault();
  if(pending) return;
  const payload = buildEnquiry();
  if(!validEnquiry(payload)) {
    setStatus('Please enter a valid business email, name, enquiry and consent.',true);
    return;
  }
  pending = true;
  button.disabled = true;
  fields.forEach(field => field.disabled = true);
  setStatus('Sending…');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch('https://zvrdbekyqbwrztckvkpw.supabase.co/functions/v1/campaign-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: 'sb_publishable_BEBIhj5Y3G5BETK9wFZFVw_URRhizrI' },
      signal: controller.signal,
      body: JSON.stringify(payload),
    });
    if (response.status === 429) {
      setStatus('Enquiry limit reached. Please wait before trying again.',true);
    } else if (response.status === 400 || response.status === 413 || response.status === 415) {
      setStatus('The enquiry was rejected. Please check your details.',true);
    } else if (response.status === 201 && (await response.json())?.received === true) {
      form.reset();
      setStatus('Your enquiry was received. The team can review it for follow-up.');
    } else {
      setStatus('Receipt could not be confirmed. Your details are retained. Check with the team before resending to avoid duplicate enquiries.',true);
    }
  } catch {
    setStatus('Receipt could not be confirmed. Your details are retained. Check with the team before resending to avoid duplicate enquiries.',true);
  } finally {
    clearTimeout(timeout);
    pending = false;
    fields.forEach(field => field.disabled = false);
    button.disabled = false;
  }
}
button.disabled = false;
form.addEventListener('submit', submitEnquiry);
</script>
</body>
</html>
