<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice Follow-up</title><meta name="description" content="Demo agent: enter invoices, see pending and overdue money automatically, and send a WhatsApp payment reminder in one tap. Data stays in your browser."></head><body><script>
window.TRK={id:'invoice',title:'Invoice Follow-up + Auto Dashboard',desc:'Enter invoices. Pending and overdue money updates by itself, and each pending invoice gets a ready WhatsApp reminder.',
fields:[{k:'invoice',label:'Invoice no.',req:1,ph:'e.g. INV-1042'},{k:'customer',label:'Customer',req:1,ph:'e.g. Sharma Traders'},{k:'phone',label:'WhatsApp number (with country code)',ph:'e.g. 919876543210'},{k:'amount',label:'Amount (Rs)',type:'number',req:1,ph:'e.g. 12500'},{k:'due',label:'Due date',type:'date'},{k:'status',label:'Status',type:'select',opts:['Pending','Paid'],edit:1}],
kpis:function(D,u){var b=0,p=0,o=0;D.forEach(function(r){var a=+r.amount||0;b+=a;if(r.status!=='Paid'){p+=a;if(String(r.due)<u.today)o+=a}});return [[u.money(b),'Total billed',''],[u.money(p),'Pending','#b45309'],[u.money(o),'Overdue','#b91c1c'],[b?Math.round(100*(b-p)/b)+'%':'-','Collected','#166534']]},
charts:[{t:'Pending amount by customer',type:'bar',by:'customer',sum:'amount',filter:function(r){return r.status!=='Paid'}},{t:'Billed amount by status',type:'donut',by:'status',sum:'amount'}],
cols:['invoice','customer','amount','due',{h:'Due status',f:function(r,T){if(r.status==='Paid')return 'Paid';var n=Math.round((new Date(T)-new Date(r.due))/864e5);return n>0?'<span class="red">'+n+' days overdue</span>':(n===0?'Due today':'Due in '+(-n)+' days')}},'status',{h:'Reminder',f:function(r,T,e,m){if(r.status==='Paid'||!r.phone)return '';var dg=String(r.phone).replace(/\D/g,'');if(!dg)return '';var over=String(r.due)<T;var t='Dear '+r.customer+', a gentle reminder: invoice '+r.invoice+' for '+m(r.amount)+(over?' was due on ':' is due on ')+r.due+'. Kindly arrange the payment. Thank you.';return '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+dg+'?text='+encodeURIComponent(t)+'">WhatsApp</a>'}}],
sort:function(a,b){var pa=a.status==='Paid'?1:0,pb=b.status==='Paid'?1:0;return pa-pb||String(a.due).localeCompare(String(b.due))},
sample:function(T,d){var c=['Sharma Traders','Patel Pharma','Om Enterprises','Kiran Stores','Bright Clinic'],o=[];for(var i=0;i<10;i++)o.push({invoice:'INV-'+(1030+i),customer:c[i%5],phone:'9199000000'+(10+i),amount:[12500,8400,21000,5600,15200,9800,33000,4200,18700,7300][i],due:d(i<6?-(5+i*6):(3+i*4)),status:i%3===0?'Paid':'Pending'});return o}};
</script><script src="tracker.js"></script></body></html>
