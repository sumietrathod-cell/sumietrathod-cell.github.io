<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker</title><meta name="description" content="Demo agent: add expenses in a short form and see monthly total, budget left and charts update automatically. Data stays in your browser."></head><body><script>
window.TRK={id:'expense',title:'Expense Tracker + Auto Dashboard',desc:'Add each expense and the monthly total, budget left and charts update by themselves.',budget:true,
fields:[{k:'date',label:'Date',type:'date',req:1},{k:'category',label:'Category',type:'select',opts:['Food','Travel','Rent','Bills','Shopping','Health','Education','Business','Other']},{k:'amount',label:'Amount (Rs)',type:'number',req:1,ph:'e.g. 450'},{k:'mode',label:'Paid by',type:'select',opts:['UPI','Cash','Card','Bank']},{k:'note',label:'Note',span:2,ph:'e.g. Lunch with client'}],
kpis:function(D,u){var m=u.today.slice(0,7),mt=0,tt=0,cat={};D.forEach(function(r){var a=+r.amount||0;tt+=a;if(String(r.date).slice(0,7)===m){mt+=a;cat[r.category]=(cat[r.category]||0)+a}});var top=Object.keys(cat).sort(function(a,b){return cat[b]-cat[a]})[0]||'-';var left=u.bud?u.bud-mt:null;return [[u.money(mt),'Spent this month',''],[u.bud?u.money(left):'Set budget','Budget left',left!=null&&left<0?'#b91c1c':'#166534'],[top,'Top category this month',''],[u.money(tt),'All time ('+D.length+' entries)','']]},
charts:[{t:'This month by category',type:'bar',by:'category',sum:'amount',filter:function(r,T){return String(r.date).slice(0,7)===T.slice(0,7)}},{t:'All time: paid by',type:'donut',by:'mode',sum:'amount'}],
cols:['date','category','amount','mode','note'],sort:function(a,b){return String(b.date).localeCompare(String(a.date))},
sample:function(T,d){var c=['Food','Travel','Rent','Bills','Shopping','Health','Education','Business','Food','Travel'],m=['UPI','Cash','Card','Bank','UPI'],n=['Lunch','Auto fare','Room rent','Electricity bill','Clothes','Medicine','Course fee','Client visit','Groceries','Fuel'],a=[320,180,9000,1450,1800,650,2500,1200,860,540],o=[];for(var i=0;i<24;i++)o.push({date:d(-i*1-(i>8?i:0)),category:c[i%10],amount:Math.round(a[i%10]*(0.8+((i*7)%5)/10)),mode:m[i%5],note:n[i%10]});return o}};
</script><script src="tracker.js"></script><script src="trial.js"></script></body></html>
