<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint Triage Agent | Aarohan QA Analytics</title><meta name="description" content="Demo agent: paste a product complaint, get category, severity, response timeline, investigation steps and a draft acknowledgement."><style>
:root{--navy:#081a32;--gold:#d5b46d;--ink:#17273c;--muted:#62718a}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;font-size:14px;border:1px solid #ffffff44;padding:7px 14px;border-radius:99px}
main{max-width:760px;margin:auto;padding:18px 16px 30px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin-bottom:14px}h1{font-size:22px;margin:0 0 4px}h3{margin:14px 0 6px}p.s{color:var(--muted);font-size:14px;margin:0 0 12px}
textarea{width:100%;padding:10px;border:1px solid #cdd6e3;border-radius:10px;font:15px system-ui;margin-top:3px}label{font-size:13px;font-weight:600}
button{background:var(--navy);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.v{font-weight:800;font-size:19px;padding:10px 14px;border-radius:10px;margin-bottom:8px}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
pre{white-space:pre-wrap;background:#fffaf0;border:1px dashed var(--gold);border-radius:10px;padding:12px;font:14px/1.5 system-ui}ul{padding-left:20px;margin:6px 0}.f{font-size:12px;color:var(--muted)}
</style></head><body><header><div><b>AAROHAN</b> QA ANALYTICS</div><a href="index.html">&larr; Website</a></header><main>
<div class="card"><h1>Complaint Triage Agent</h1><p class="s">Paste the complaint as received. The agent suggests category, severity, timeline and investigation steps.</p>
<label>Complaint text<textarea id="t" rows="4">Pharmacist reports that 3 strips of Paracetamol 500 mg tablets, batch PT25-017, had broken tablets and a patient felt nauseous after taking one tablet.</textarea></label>
<button onclick="run()">Triage complaint</button></div><div id="o"></div>
<p class="f">Demonstration only. Adverse event handling, timelines and final classification follow your SOP, local regulation and QA.</p></main>
<script>
var C=[["Adverse event / patient safety",/nause|vomit|reaction|allerg|hospital|injur|adverse|side effect|rash|death|died|ill\b|felt/i,"Critical"],["Foreign matter / contamination",/foreign|particle|insect|hair|glass|metal|contamin|fungus|mould|mold/i,"Critical"],["Mix-up / wrong product or label",/wrong|mix.?up|label|different tablet|mislabel|expiry|batch no/i,"Major"],["Physical defect (tablet / pack)",/broken|crack|chip|cap|stain|discolo|leak|seal|crush|damaged|blister|strip/i,"Minor"],["Efficacy / potency concern",/not work|no effect|ineffective|potency|dissol/i,"Major"]];
function run(){var t=document.getElementById('t').value,hit=C.filter(function(c){return c[1].test(t)});if(!hit.length)hit=[["Other / unclassified",null,"Minor"]];
var rank={Critical:3,Major:2,Minor:1},sev=hit.reduce(function(a,c){return rank[c[2]]>rank[a]?c[2]:a},"Minor"),b=(t.match(/[A-Z]{1,4}\d{2}-\d{2,4}/)||['not stated'])[0],cl=sev==='Critical'?'bad':sev==='Major'?'warn':'ok';
var ae=hit.some(function(c){return c[0].indexOf('Adverse')===0});
var tl=sev==='Critical'?'Acknowledge within 24 h; inform QA Head immediately; evaluate need for market action and regulatory reporting per SOP.':sev==='Major'?'Acknowledge within 2 working days; investigation to close in 15 working days.':'Acknowledge within 3 working days; investigation to close in 30 working days.';
var st=['Log the complaint and assign a number; retrieve retention sample and batch records for '+b,'Inspect the returned sample if available, record observations with photos','Review batch manufacturing, packaging and QC records and related deviations','Check other complaints for the same batch or defect (trend)','Decide root cause, CAPA and reply to the complainant'];
if(ae)st.unshift('Collect patient and event details; refer to pharmacovigilance procedure');
document.getElementById('o').innerHTML='<div class="card"><div class="v '+cl+'">'+sev+': '+hit.map(function(c){return c[0]}).join(' + ')+'</div><p><b>Batch:</b> '+b+'<br><b>Timeline:</b> '+tl+'</p><h3>Investigation steps</h3><ul>'+st.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div><div class="card"><h3 style="margin-top:0">Draft acknowledgement</h3><pre id="p">Dear Sir/Madam,\n\nThank you for informing us about your concern regarding batch '+b+'. We take every report seriously and have opened an investigation. Please keep the product and packaging, and share any photos and purchase details. We will update you on the outcome '+(sev==='Critical'?'as soon as possible':'within the agreed time')+'.\n\nRegards,\nQuality Assurance</pre><button onclick="navigator.clipboard.writeText(document.getElementById(\'p\').innerText);this.textContent=\'Copied\'">Copy reply</button></div>'}
run();
</script><script src="trial.js"></script></body></html>
