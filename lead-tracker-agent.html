<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Tracker</title><meta name="description" content="Demo agent: add leads, move them through stages, see follow-ups due and pipeline value automatically, and message them on WhatsApp. Data stays in your browser."></head><body><script>
window.TRK={id:'lead',title:'Lead Tracker + Auto Dashboard',desc:'Add leads and change their stage. Follow-ups due, won deals and pipeline value update by themselves, with a ready WhatsApp message.',
fields:[{k:'name',label:'Lead name',req:1,ph:'e.g. Ravi Mehta'},{k:'phone',label:'WhatsApp number (with country code)',ph:'e.g. 919876543210'},{k:'source',label:'Source',type:'select',opts:['WhatsApp','Instagram','Facebook','Walk-in','Referral','Website']},{k:'interest',label:'Interested in',ph:'e.g. Shop billing app'},{k:'value',label:'Expected value (Rs)',type:'number',ph:'e.g. 8000'},{k:'stage',label:'Stage',type:'select',opts:['New','Contacted','Interested','Quote sent','Won','Lost'],edit:1},{k:'follow',label:'Next follow-up',type:'date'}],
kpis:function(D,u){var open=D.filter(function(r){return r.stage!=='Won'&&r.stage!=='Lost'}),due=open.filter(function(r){return r.follow&&String(r.follow)<=u.today}).length,won=D.filter(function(r){return r.stage==='Won'}).length,pv=0;open.forEach(function(r){pv+=+r.value||0});var cl=D.filter(function(r){return r.stage==='Won'||r.stage==='Lost'}).length;return [[D.length,'Total leads',''],[due,'Follow-ups due today or late',due?'#b91c1c':'#166534'],[won+(cl?' ('+Math.round(100*won/cl)+'%)':''),'Won (win rate)','#166534'],[u.money(pv),'Open pipeline value','#3b5bdb']]},
charts:[{t:'Leads by stage',type:'bar',by:'stage'},{t:'Leads by source',type:'donut',by:'source'}],
cols:['name','source','interest','value','stage','follow',{h:'Message',f:function(r,T,e,m){if(!r.phone)return '';var dg=String(r.phone).replace(/\D/g,'');if(!dg)return '';var t='Hello '+r.name+', this is '+((window.TRK.brand&&window.TRK.brand.name)||'Sumit from Aarohan')+'. Following up on '+(r.interest||'your enquiry')+'. Can we talk today?';return '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+dg+'?text='+encodeURIComponent(t)+'">WhatsApp</a>'}}],
sort:function(a,b){var oa=(a.stage==='Won'||a.stage==='Lost')?1:0,ob=(b.stage==='Won'||b.stage==='Lost')?1:0;return oa-ob||String(a.follow).localeCompare(String(b.follow))},
sample:function(T,d){var n=['Ravi Mehta','Kajal Shah','Imran Khan','Neha Joshi','Dr. Patel Clinic','Sunil Traders','Pooja Beauty Salon','Aman Tuition','Raj Medical','Hetal Boutique','Vikram Auto','Mira Bakery'],it=['Shop billing app','Booking app','Website','Fee reminder agent','Clinic follow-up','Stock reorder agent','Salon booking','Tuition fee app','Pharma QA tracker','Catalogue app','Invoice app','Order app'],s=['New','Contacted','Interested','Quote sent','Won','Lost'],so=['WhatsApp','Instagram','Facebook','Walk-in','Referral','Website'],o=[];for(var i=0;i<12;i++)o.push({name:n[i],phone:'9198000000'+(10+i),source:so[i%6],interest:it[i],value:[8000,5000,6000,3000,9000,7000,5500,2500,8500,4000,6500,3500][i],stage:s[(i*5)%6],follow:d(i%4===0?-2:(i%5)-1+1)});return o}};
</script><script src="tracker.js"></script></body></html>
