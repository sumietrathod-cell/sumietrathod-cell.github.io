<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Turbo Race | Kids Games</title><meta name="description" content="Free kids racing game. Tap left or right to change lane, dodge cars and collect coins."><style>
html,body{margin:0;height:100%;background:#0b1b33;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,Arial,sans-serif}
#w{height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,56.25vh);aspect-ratio:9/16;border-radius:12px;box-shadow:0 0 30px #0008;display:block}
a.b{position:fixed;top:8px;left:8px;color:#fff;background:#0007;padding:6px 12px;border-radius:99px;text-decoration:none;font-size:14px;z-index:5}
</style></head><body><a class="b" href="games.html">&larr; Games</a><div id="w"><canvas id="c"></canvas></div><script>
var c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=640;c.width=W;c.height=H;
var LW=W/3,best=0;try{best=+(localStorage.getItem('kg_race')||0)}catch(e){}
function lane(i){return LW*i+LW/2}
var cars=[],coins=[],px=1,cx=lane(1),off=0,spd=200,lives=3,inv=0,spawnT=0,dist=0,got=0,st='menu',score=0;
function reset(){cars=[];coins=[];px=1;cx=lane(1);off=0;spd=200;lives=3;inv=0;spawnT=0;dist=0;got=0;score=0;st='play'}
function move(d){if(st==='play')px=Math.max(0,Math.min(2,px+d))}
c.addEventListener('pointerdown',function(e){e.preventDefault();var r=c.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*W;if(st!=='play'){reset();return}move(X<W/2?-1:1)});
addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='a')move(-1);else if(e.key==='ArrowRight'||e.key==='d')move(1);else if((e.key===' '||e.key==='Enter')&&st!=='play')reset()});
function R(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,r);else x.rect(a,b,w,h);x.fill()}
function car(X,Y,col,me){R(X-22,Y-36,44,72,10,col);R(X-16,Y-20,32,18,4,'#bfe8ff');R(X-16,Y+8,32,10,3,'#8cc6e6');R(X-26,Y-28,6,18,3,'#111');R(X+20,Y-28,6,18,3,'#111');R(X-26,Y+12,6,18,3,'#111');R(X+20,Y+12,6,18,3,'#111');if(me){R(X-14,Y-36,8,5,2,'#fff7a8');R(X+6,Y-36,8,5,2,'#fff7a8')}}
function upd(dt){if(st!=='play')return;spd=Math.min(430,spd+dt*6);off=(off+spd*dt)%60;dist+=spd*dt/10;cx+=(lane(px)-cx)*Math.min(1,dt*14);inv=Math.max(0,inv-dt);
spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.55,1.1-spd/900)+Math.random()*.3;var l=Math.floor(Math.random()*3);cars.push({l:l,y:-60,col:['#e74c3c','#3498db','#f1c40f','#9b59b6','#16a085'][Math.floor(Math.random()*5)]});if(Math.random()<.65){var cl=(l+1+Math.floor(Math.random()*2))%3;coins.push({l:cl,y:-60-Math.random()*120})}}
cars.forEach(function(o){o.y+=spd*dt*.8});coins.forEach(function(o){o.y+=spd*dt});
cars=cars.filter(function(o){if(inv===0&&Math.abs(o.y-520)<58&&Math.abs(lane(o.l)-cx)<34){lives--;inv=1.5;return false}return o.y<720});
coins=coins.filter(function(o){if(Math.abs(o.y-520)<44&&Math.abs(lane(o.l)-cx)<36){got++;return false}return o.y<720});
score=Math.floor(dist)+got*10;if(lives<=0){st='over';if(score>best){best=score;try{localStorage.setItem('kg_race',best)}catch(e){}}}}
function T(s,X,Y,sz,col,al){x.font='bold '+sz+'px system-ui,Arial';x.fillStyle=col||'#fff';x.textAlign=al||'center';x.fillText(s,X,Y)}
function draw(){x.fillStyle='#2e8b3d';x.fillRect(0,0,W,H);x.fillStyle='#3a3f4a';x.fillRect(20,0,W-40,H);
x.fillStyle='#fff';for(var i=1;i<3;i++){for(var y=-60+off;y<H;y+=60)x.fillRect(i*LW-3,y,6,30)}x.fillStyle='#ffd23f';x.fillRect(20,0,5,H);x.fillRect(W-25,0,5,H);
coins.forEach(function(o){x.fillStyle='#ffd23f';x.beginPath();x.arc(lane(o.l),o.y,14,0,7);x.fill();x.strokeStyle='#c99a00';x.lineWidth=3;x.stroke();T('$',lane(o.l),o.y+6,16,'#a67c00')});
cars.forEach(function(o){car(lane(o.l),o.y,o.col,0)});
if(inv===0||Math.floor(inv*10)%2===0)car(cx,520,'#ff4d6d',1);
T('Score '+score,12,34,22,'#fff','left');T('Best '+best,W-12,34,16,'#ffe08a','right');T('❤'.repeat(Math.max(0,lives)),W-12,58,18,'#ff5c7a','right');
if(st!=='play'){x.fillStyle='#000a';x.fillRect(0,0,W,H);T('TURBO RACE',W/2,230,38,'#ffd23f');if(st==='over'){T('Game over!',W/2,290,28);T('Score '+score+'   Best '+best,W/2,330,22,'#ffe08a')}else{T('Tap left or right side',W/2,300,20);T('to change lane',W/2,326,20);T('Dodge cars, grab coins',W/2,366,18,'#bfe8ff')}T(st==='over'?'Tap to play again':'Tap to start',W/2,430,24,'#7CFF8A')}}
var last=performance.now();function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
