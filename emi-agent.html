<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan EMI Calculator Agent | Aarohan QA Analytics</title><meta name="description" content="Demo agent: enter loan amount, rate and tenure, get the EMI, total interest, a payment schedule and a plain-language tip on prepayment."><style>
:root{--navy:#081a32;--gold:#d5b46d;--ink:#17273c;--muted:#62718a}*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif;background:#f5f7fb;color:var(--ink)}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}header a{color:#fff;font-size:14px;border:1px solid #ffffff44;padding:7px 14px;border-radius:99px}
main{max-width:760px;margin:auto;padding:18px 16px 30px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:18px;margin-bottom:14px}h1{font-size:22px;margin:0 0 4px}h3{margin:12px 0 4px;font-size:15px}p.s{color:var(--muted);font-size:14px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{font-size:13px;font-weight:600;display:block}input{width:100%;padding:10px;border:1px solid #cdd6e3;border-radius:10px;font:15px system-ui;margin-top:3px}
button{background:var(--navy);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.k div{background:#f5f7fb;border-radius:10px;padding:10px;text-align:center}.k b{display:block;font-size:21px}.k span{font-size:12px;color:var(--muted)}
.bar{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid #eef1f6;text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--muted);text-transform:uppercase}.tw{max-height:300px;overflow:auto}.f{font-size:12px;color:var(--muted)}@media(max-width:560px){.g{grid-template-columns:1fr 1fr}.k{grid-template-columns:1fr}}
</style></head><body><header><div><b>AAROHAN</b> QA ANALYTICS</div><a href="index.html">&larr; Website</a></header><main>
<div class="card"><h1>Loan EMI Calculator Agent</h1><p class="s">Enter the loan details. Optionally add a yearly prepayment to see how much interest and time you save.</p>
<div class="g"><label>Loan amount (Rs)<input id="p" type="number" value="500000"></label><label>Interest % per year<input id="r" type="number" step="any" value="10.5"></label><label>Tenure (years)<input id="y" type="number" step="any" value="5"></label><label>Extra yearly payment (Rs)<input id="x" type="number" value="25000"></label></div><button onclick="run()">Calculate</button></div><div id="o"></div><p class="f">Demonstration only. Banks may add fees and round differently. Check with your lender.</p></main>
<script>
function sch(P,r,n,ex){var m=r/1200,e=m?P*m*Math.pow(1+m,n)/(Math.pow(1+m,n)-1):P/n,b=P,rows=[],ti=0,k=0;while(b>0.5&&k<600){k++;var i=b*m,pr=e-i;if(pr>b)pr=b;b-=pr;ti+=i;if(ex>0&&k%12===0&&b>0){var x=Math.min(ex,b);b-=x;pr+=x}rows.push([k,i,pr,Math.max(b,0)])}return{e:e,rows:rows,ti:ti,n:k}}
function run(){var P=+document.getElementById('p').value,r=+document.getElementById('r').value,y=+document.getElementById('y').value,ex=+document.getElementById('x').value||0,n=Math.round(y*12),fm=function(v){return 'Rs '+Math.round(v).toLocaleString('en-IN')};
if(!(P>0&&r>=0&&n>0)){document.getElementById('o').innerHTML='<div class="card">Please enter valid numbers.</div>';return}
var a=sch(P,r,n,0),b=ex>0?sch(P,r,n,ex):null,tot=P+a.ti;
document.getElementById('o').innerHTML='<div class="card"><div class="k"><div><b>'+fm(a.e)+'</b><span>Monthly EMI</span></div><div><b>'+fm(a.ti)+'</b><span>Total interest</span></div><div><b>'+fm(tot)+'</b><span>Total payment</span></div></div><div class="bar"><i style="width:'+(P/tot*100)+'%;background:#14286b"></i><i style="width:'+(a.ti/tot*100)+'%;background:#d5b46d"></i></div><div class="f">Dark: principal ('+Math.round(P/tot*100)+'%). Gold: interest ('+Math.round(a.ti/tot*100)+'%).</div>'+(b?'<h3>Prepayment tip</h3><p>Paying an extra '+fm(ex)+' every year saves about <b>'+fm(a.ti-b.ti)+'</b> in interest and finishes the loan '+Math.floor((a.n-b.n)/12)+' years '+((a.n-b.n)%12)+' months earlier.</p>':'')+'</div><div class="card"><h3 style="margin-top:0">Payment schedule</h3><div class="tw"><table><thead><tr><th>Month</th><th>Interest</th><th>Principal</th><th>Balance</th></tr></thead><tbody>'+a.rows.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+Math.round(x[1]).toLocaleString('en-IN')+'</td><td>'+Math.round(x[2]).toLocaleString('en-IN')+'</td><td>'+Math.round(x[3]).toLocaleString('en-IN')+'</td></tr>'}).join('')+'</tbody></table></div></div>'}
run();
</script></body></html>
