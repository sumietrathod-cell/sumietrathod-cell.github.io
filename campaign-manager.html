<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Campaign Manager | AAROHAN AI WORLD</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; color: #edf4ff; background: #0c1220; }
* { box-sizing: border-box; }
body { margin: 0; }
header, main { width: min(72rem, 100% - 2rem); margin: auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: 1.25rem; border-bottom: 1px solid #28374e; }
header a { color: inherit; font-weight: 750; text-decoration: none; letter-spacing: .08em; }
main { padding-block: clamp(2rem, 6vw, 5rem); }
h1 { margin: 0 0 1rem; font-size: clamp(2rem, 6vw, 3.6rem); letter-spacing: -.05em; }
h2 { margin-top: 0; }
p { color: #abbcd5; line-height: 1.6; }
form, article { background: #151f31; border: 1px solid #2b3b54; border-radius: 1rem; padding: clamp(1rem, 4vw, 1.75rem); }
form { max-width: 28rem; display: grid; gap: .75rem; }
input, button { font: inherit; min-height: 2.9rem; border-radius: .55rem; padding: .6rem .8rem; }
input { width: 100%; color: inherit; background: #0e1828; border: 1px solid #526886; margin-top: .35rem; }
button { cursor: pointer; font-weight: 700; color: #0b1724; background: #86e6d1; border: 0; }
button:disabled { opacity: .65; cursor: wait; }
:focus-visible { outline: 2px solid #a5d3ff; outline-offset: 3px; }
[hidden] { display: none !important; }
#message { color: #fbc6ae; }
#message:empty { display: none; }
#recovery-options { max-width: 28rem; margin-top: 1rem; }
summary { cursor: pointer; color: #86e6d1; }
#request-reset { margin-top: .75rem; }
#lead-tools form { max-width: none; margin-block: .75rem; }
#lead-tools details + details { margin-top: 1rem; }
.lead-fields { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); }
#dashboard { display: grid; gap: 1rem; }
.dashboard-title { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; justify-content: space-between; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: .75rem 0; overflow-wrap: anywhere; }
.list li + li { border-top: 1px solid #2b3b54; }
.list strong, .list span { display: block; }
.list span { color: #abbcd5; margin-top: .3rem; }
</style>
</head>
<body>
<header><a href="./">AAROHAN AI WORLD</a><button id="sign-out" type="button" hidden>Sign out</button></header>
<main>
<h1>Campaign Manager</h1>
<p id="message" role="alert"></p>
<form id="sign-in" method="post">
  <label>Email<input id="email" type="email" autocomplete="username" required></label>
  <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
  <button id="submit" type="submit">Sign in</button>
</form>
<details id="recovery-options">
  <summary>Set or reset password</summary>
  <form id="request-reset" method="post">
    <label>Account email<input id="reset-email" type="email" autocomplete="email" required></label>
    <button type="submit">Send password link</button>
  </form>
</details>
<form id="set-password" method="post" hidden>
  <h2>Set a new password</h2>
  <label>New password<input id="new-password" type="password" autocomplete="new-password" minlength="12" required></label>
  <label>Confirm new password<input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required></label>
  <button type="submit">Save password</button>
</form>
<section id="dashboard" aria-label="Campaign Manager dashboard" hidden>
  <div class="dashboard-title"><h2 id="role-heading" tabindex="-1"></h2><button id="more" type="button" hidden>Load more leads</button></div>
  <article id="lead-tools" hidden>
    <h2>Manage leads</h2>
    <p id="lead-feedback" role="status"></p>
    <details>
      <summary>Add lead</summary>
      <form id="add-lead" method="post">
        <div class="lead-fields">
          <label>Name<input id="lead-name" required maxlength="200"></label>
          <label>Business<input id="lead-company" maxlength="200"></label>
          <label>Country<input id="lead-country" maxlength="100"></label>
          <label>Email<input id="lead-email" type="email" maxlength="254"></label>
          <label>Phone<input id="lead-phone" type="tel" maxlength="40"></label>
          <label>Source<input id="lead-source" maxlength="100" placeholder="Manual"></label>
          <label>Status<input id="lead-status" maxlength="100" placeholder="New"></label>
        </div>
        <button type="submit">Save lead</button>
      </form>
    </details>
    <details>
      <summary>Import CSV</summary>
      <form id="import-leads" method="post">
        <label>CSV file<input id="lead-file" type="file" accept=".csv,text/csv" required></label>
        <p>Use a header row with Name. Optional columns are Business, Country, Email, Phone, Source and Status. Import up to 500 rows at once.</p>
        <div id="import-preview" hidden>
          <p id="import-count"></p>
          <ul class="list" id="import-list"></ul>
        </div>
        <button id="import-submit" type="submit" disabled>Import leads</button>
      </form>
    </details>
  </article>
  <article id="partner-card" hidden><h2>Partner profile</h2><ul class="list" id="partner-list"></ul></article>
  <article><h2>Leads</h2><ul class="list" id="lead-list"></ul></article>
</section>
</main>
<script type="module">
const apiUrl = 'https://zvrdbekyqbwrztckvkpw.supabase.co';
const apiKey = 'sb_publishable_BEBIhj5Y3G5BETK9wFZFVw_URRhizrI';
const pageSize = 25;
const form = document.querySelector('#sign-in');
const submit = document.querySelector('#submit');
const password = document.querySelector('#password');
const signOut = document.querySelector('#sign-out');
const message = document.querySelector('#message');
const recoveryOptions = document.querySelector('#recovery-options');
const requestReset = document.querySelector('#request-reset');
const setPassword = document.querySelector('#set-password');
const dashboard = document.querySelector('#dashboard');
const roleHeading = document.querySelector('#role-heading');
const partnerCard = document.querySelector('#partner-card');
const partnerList = document.querySelector('#partner-list');
const leadList = document.querySelector('#lead-list');
const leadTools = document.querySelector('#lead-tools');
const leadFeedback = document.querySelector('#lead-feedback');
const addLead = document.querySelector('#add-lead');
const importLeads = document.querySelector('#import-leads');
const leadFile = document.querySelector('#lead-file');
const importCount = document.querySelector('#import-count');
const importList = document.querySelector('#import-list');
const importPreview = document.querySelector('#import-preview');
const importSubmit = document.querySelector('#import-submit');
const leadFieldLimits = { name: 200, company: 200, country: 100, email: 254, phone: 40, source: 100, status: 100 };
const aliases = { business: 'company', business_name: 'company', company_name: 'company', lead_name: 'name', contact_name: 'name', email_address: 'email', phone_number: 'phone' };
let pendingLeads = [];
let savingLeads = false;
const more = document.querySelector('#more');
let accessToken;
let expires;
let offset = 0;

async function request(path, options = {}, token = accessToken) {
  const headers = new Headers({ apikey: apiKey, 'Content-Type': 'application/json' });
  if (token) headers.set('Authorization', 'Bearer ' + token);
  const response = await fetch(apiUrl + path, { ...options, headers, cache: 'no-store' });
  if (!response.ok) {
    const error = new Error('Request failed');
    error.status = response.status;
    throw error;
  }
  return response.status === 204 ? null : response.json();
}

function renderRows(list, rows, emptyText, append = false) {
  const entries = rows.length ? rows : [{ title: emptyText }];
  const items = entries.map(({ title, detail }) => {
    const item = document.createElement('li');
    const heading = document.createElement('strong');
    heading.textContent = title;
    item.append(heading);
    if (detail) {
      const summary = document.createElement('span');
      summary.textContent = detail;
      item.append(summary);
    }
    return item;
  });
  if (append) {
    if (rows.length) list.append(...items);
  } else {
    list.replaceChildren(...items);
  }
}

async function loadLeads() {
  const token = accessToken;
  if (!token) return;
  const rows = await request('/rest/v1/leads?select=id,name,company,country,status&order=created_at.desc.nullslast,id.asc&limit=' + (pageSize + 1) + '&offset=' + offset);
  if (token !== accessToken) return;
  renderRows(leadList, rows.slice(0, pageSize).map(lead => ({
    title: lead.name,
    detail: [lead.company, lead.country, lead.status].filter(Boolean).join(' · '),
  })), 'No leads to display.', offset > 0);
  offset += pageSize;
  more.hidden = rows.length <= pageSize;
}

function clearSession() {
  clearTimeout(expires);
  accessToken = undefined;
  offset = 0;
  dashboard.hidden = true;
  leadTools.hidden = true;
  addLead.reset();
  importLeads.reset();
  resetImport();
  leadFeedback.textContent = '';
  partnerCard.hidden = true;
  signOut.hidden = true;
  more.hidden = true;
  partnerList.replaceChildren();
  leadList.replaceChildren();
  form.hidden = false;
  recoveryOptions.hidden = false;
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  submit.disabled = true;
  message.textContent = '';
  let session;
  try {
    session = await request('/auth/v1/token?grant_type=password', {
      method: 'POST',
      body: JSON.stringify({ email: form.elements.email.value.trim(), password: password.value }),
    });
    password.value = '';
    accessToken = session.access_token;
    const admin = session.user?.app_metadata?.campaign_manager_role === 'admin';
    if (!admin) {
      const profiles = await request('/rest/v1/partners?select=name,commission_rate&limit=1');
      if (!profiles.length) {
        message.textContent = 'Your account does not have Campaign Manager access.';
        await request('/auth/v1/logout', { method: 'POST' }).catch(() => {});
        clearSession();
        return;
      }
      renderRows(partnerList, profiles.map(profile => ({
        title: profile.name,
        detail: profile.commission_rate == null ? '' : profile.commission_rate + '% commission rate',
      })), 'No partner profile.');
      partnerCard.hidden = false;
    }
    await loadLeads();
    roleHeading.textContent = admin ? 'Admin dashboard' : 'Partner dashboard';
    form.hidden = true;
    recoveryOptions.hidden = true;
    dashboard.hidden = false;
    leadTools.hidden = !admin;
    signOut.hidden = false;
    roleHeading.focus();
    expires = setTimeout(() => {
      clearSession();
      message.textContent = 'Your session expired. Sign in again.';
    }, session.expires_in * 1000);
  } catch (error) {
    if (accessToken) await request('/auth/v1/logout', { method: 'POST' }).catch(() => {});
    clearSession();
    message.textContent = !session && [400, 401, 422].includes(error.status)
      ? 'Email or password is incorrect, or the account needs confirmation.'
      : 'Campaign Manager is unavailable. Try again.';
  } finally {
    password.value = '';
    submit.disabled = false;
  }
});

more.addEventListener('click', async () => {
  more.disabled = true;
  message.textContent = '';
  try {
    await loadLeads();
  } catch (error) {
    if (error.status === 401) clearSession();
    message.textContent = error.status === 401 ? 'Your session expired. Sign in again.' : 'Could not load more leads. Try again.';
  } finally {
    more.disabled = false;
  }
});

signOut.addEventListener('click', async () => {
  signOut.disabled = true;
  message.textContent = '';
  try {
    await request('/auth/v1/logout', { method: 'POST' });
  } catch {
    message.textContent = 'Signed out on this page. Supabase could not confirm sign-out.';
  } finally {
    clearSession();
    signOut.disabled = false;
    form.elements.email.focus();
  }
});
function validateLead(lead) {
  if (!lead.name) throw new Error('Name is required.');
  for (const [field, max] of Object.entries(leadFieldLimits)) {
    if ((lead[field] || '').length > max) throw new Error(field + ' is too long.');
  }
  if (lead.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lead.email)) throw new Error('Enter a valid email.');
  if (lead.phone && !/^\d{5,20}$/.test(lead.phone.replace(/\D/g, ''))) throw new Error('Enter a phone number with 5 to 20 digits.');
  return lead;
}

function parseLeadCsv(raw) {
  const input = raw.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n') + '\n';
  const rows = [];
  let values = [];
  let field = '';
  let quoted = false;
  let closedQuote = false;
  for (let index = 0; index < input.length; index++) {
    const char = input[index];
    if (quoted) {
      if (char === '"' && input[index + 1] === '"') {
        field += '"';
        index++;
      } else if (char === '"') {
        quoted = false;
        closedQuote = true;
      } else {
        field += char;
      }
      continue;
    }
    if (char === ',' || char === '\n') {
      values.push(field.trim());
      field = '';
      closedQuote = false;
      if (char === '\n') {
        if (values.some(Boolean)) rows.push(values);
        if (rows.length > 501) throw new Error('Import up to 500 leads per file.');
        values = [];
      }
    } else if (char === '"' && !field && !closedQuote) {
      quoted = true;
    } else if (char === '"' || closedQuote) {
      throw new Error('CSV contains an unexpected quotation mark.');
    } else {
      field += char;
    }
  }
  if (quoted) throw new Error('CSV contains an unclosed quoted field.');
  const header = (rows.shift() || []).map(value => {
    const label = value.toLowerCase().replace(/\s+/g, '_');
    return aliases[label] || label;
  });
  if (!header.includes('name')) throw new Error('The CSV needs a Name column.');
  const recognized = header.filter(value => Object.hasOwn(leadFieldLimits, value));
  if (new Set(recognized).size !== recognized.length) throw new Error('Remove duplicate lead columns.');
  if (!rows.length) throw new Error('The CSV contains no leads.');
  return rows.map((row, index) => {
    try {
      if (row.length !== header.length) throw new Error('The column count differs from the header.');
      const lead = Object.fromEntries(header.flatMap((key, column) =>
        Object.hasOwn(leadFieldLimits, key) ? [[key, row[column]]] : []));
      return validateLead({ ...lead, source: lead.source || 'CSV import' });
    } catch (error) {
      throw new Error('Lead ' + (index + 1) + ' · ' + error.message);
    }
  });
}

function resetImport() {
  pendingLeads = [];
  importPreview.hidden = true;
  importSubmit.disabled = true;
  importList.replaceChildren();
}

leadFile.addEventListener('change', async () => {
  resetImport();
  leadFeedback.textContent = '';
  const file = leadFile.files[0];
  if (!file) return;
  try {
    if (file.size > 1000000) throw new Error('Choose a CSV file smaller than 1 MB.');
    const raw = await file.text();
    if (file !== leadFile.files[0] || leadTools.hidden) return;
    pendingLeads = parseLeadCsv(raw);
    importCount.textContent = 'Valid rows · ' + pendingLeads.length + '. Showing the first ' + Math.min(12, pendingLeads.length) + '.';
    renderRows(importList, pendingLeads.slice(0, 12).map(lead => ({
      title: lead.name, detail: [lead.company, lead.country, lead.email, lead.phone].filter(Boolean).join(' · '),
    })), '');
    importPreview.hidden = false;
    importSubmit.disabled = false;
  } catch (error) {
    leadFeedback.textContent = error.message;
  }
});

async function saveLeadBatch(entries, retryForm) {
  if (!accessToken || savingLeads) return;
  savingLeads = true;
  const token = accessToken;
  const manualSubmit = addLead.querySelector('button');
  manualSubmit.disabled = true;
  importSubmit.disabled = true;
  leadFile.disabled = true;
  leadFeedback.textContent = '';
  try {
    const result = await request('/rest/v1/rpc/campaign_import_leads', {
      method: 'POST', body: JSON.stringify({ entries }),
    }, token);
    if (accessToken !== token) return;
    retryForm.reset();
    if (retryForm === importLeads) resetImport();
    leadFeedback.textContent = result.inserted + ' saved · ' + result.duplicates + ' duplicates skipped.';
    offset = 0;
    await loadLeads().catch(() => {
      if (accessToken === token) leadFeedback.textContent += ' Refresh the leads list by signing in again.';
    });
  } catch (error) {
    if (accessToken !== token) return;
    if (error.status === 401) {
      clearSession();
      message.textContent = 'Your session expired. Sign in again.';
    } else {
      leadFeedback.textContent = 'Could not save leads. You can retry without creating duplicates.';
    }
  } finally {
    savingLeads = false;
    leadFile.disabled = false;
    manualSubmit.disabled = false;
    importSubmit.disabled = !pendingLeads.length;
  }
}

addLead.addEventListener('submit', async event => {
  event.preventDefault();
  try {
    const lead = Object.fromEntries(Object.keys(leadFieldLimits).map(key =>
      [key, addLead.elements['lead-' + key].value.trim()]));
    await saveLeadBatch([validateLead(lead)], addLead);
  } catch (error) {
    leadFeedback.textContent = error.message;
  }
});

importLeads.addEventListener('submit', async event => {
  event.preventDefault();
  if (pendingLeads.length) await saveLeadBatch(pendingLeads, importLeads);
});

const redirectUrl = new URL(location.pathname, location.origin).href;
const recoveryParams = new URLSearchParams(location.hash.slice(1));
let recoveryToken = recoveryParams.get('type') === 'recovery' ? recoveryParams.get('access_token') : null;
if (recoveryParams.has('access_token') || recoveryParams.has('error_code')) {
  history.replaceState(null, '', location.pathname);
}
if (recoveryToken) {
  form.hidden = true;
  recoveryOptions.hidden = true;
  setPassword.hidden = false;
  setPassword.elements['new-password'].focus();
} else if (recoveryParams.has('error_code')) {
  message.textContent = 'This link has expired or is invalid. Request a new password link.';
  recoveryOptions.open = true;
}

requestReset.addEventListener('submit', async event => {
  event.preventDefault();
  const button = requestReset.querySelector('button');
  button.disabled = true;
  message.textContent = '';
  try {
    await request('/auth/v1/recover?redirect_to=' + encodeURIComponent(redirectUrl), {
      method: 'POST',
      body: JSON.stringify({ email: requestReset.elements['reset-email'].value.trim() }),
    });
    message.textContent = 'If your account exists, Supabase will send a password link. Check your inbox and spam folder.';
  } catch (error) {
    message.textContent = error.status === 429 ? 'Please wait before requesting another link.' : 'Could not request a password link. Try again.';
  } finally {
    button.disabled = false;
  }
});

setPassword.addEventListener('submit', async event => {
  event.preventDefault();
  if (!recoveryToken) return;
  const fields = setPassword.elements;
  const nextPassword = fields['new-password'].value;
  if (nextPassword !== fields['confirm-password'].value) {
    message.textContent = 'The passwords do not match.';
    fields['confirm-password'].focus();
    return;
  }
  const button = setPassword.querySelector('button');
  button.disabled = true;
  message.textContent = '';
  try {
    await request('/auth/v1/user', { method: 'PUT', body: JSON.stringify({ password: nextPassword }) }, recoveryToken);
    await request('/auth/v1/logout?scope=local', { method: 'POST' }, recoveryToken).catch(() => {});
    message.textContent = 'Password saved. Sign in with your new password.';
  } catch (error) {
    if (![401, 403].includes(error.status)) {
      message.textContent = 'Could not save the password. Check the password requirements and try again.';
      return;
    }
    message.textContent = 'This link has expired or is invalid. Request a new password link.';
    recoveryOptions.open = true;
  } finally {
    button.disabled = false;
  }
  recoveryToken = null;
  setPassword.reset();
  setPassword.hidden = true;
  form.hidden = false;
  recoveryOptions.hidden = false;
  form.elements.email.focus();
});
</script>
</body>
</html>
