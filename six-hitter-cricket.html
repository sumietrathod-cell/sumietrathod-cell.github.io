<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Six Hitter Cricket | Kids Games</title><meta name="description" content="Free kids cricket game. Tap at the right moment to hit the ball for 6, 4 or runs."><style>
html,body{margin:0;height:100%;background:#0b1b33;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,Arial,sans-serif}
#w{height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,56.25vh);aspect-ratio:9/16;border-radius:12px;box-shadow:0 0 30px #0008;display:block}
a.b{position:fixed;top:8px;left:8px;color:#fff;background:#0007;padding:6px 12px;border-radius:99px;text-decoration:none;font-size:14px;z-index:5}
</style></head><body><a class="b" href="games.html">&larr; Games</a><div id="w"><canvas id="c"></canvas></div><script>
var c=document.getElementById('c'),x=c.getContext('2d'),W=360,H=640;c.width=W;c.height=H;
var best=0;try{best=+(localStorage.getItem('kg_cricket')||0)}catch(e){}
var st='menu',runs,balls,wk,ball,msg,msgT,fly,swung,pause,BALLS=12,WK=3,ZY=520;
function reset(){runs=0;balls=0;wk=0;msg='';msgT=0;fly=null;st='play';next()}
function next(){if(balls>=BALLS||wk>=WK){end();return}ball={x:180+(Math.random()*80-40),dx:Math.random()*30-15,y:70,v:230+Math.random()*50+balls*14};swung=false;pause=0.7}
function end(){st='over';if(runs>best){best=runs;try{localStorage.setItem('kg_cricket',best)}catch(e){}}}
function say(s,col){msg=s;msgT=1.1;msgC=col||'#fff'}var msgC='#fff';
function tap(){if(st!=='play'){reset();return}if(!ball||swung||pause>0)return;swung=true;var d=Math.abs(ball.y-ZY);
if(d<55&&ball.y>ZY-55){var r=d<12?6:d<28?4:d<46?2:1;runs+=r;balls++;fly={x:ball.x,y:ball.y,vx:(Math.random()*160-80),vy:-420-r*40,t:0};ball=null;say(r===6?'SIX! \u{1F680}':r===4?'FOUR!':r+' run'+(r>1?'s':''),r>=4?'#ffd23f':'#fff');setTimeout(next,900)}else say('Too early!','#ff9d9d')}
c.addEventListener('pointerdown',function(e){e.preventDefault();tap()});addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'||e.key==='ArrowUp')tap()});
function upd(dt){if(msgT>0)msgT-=dt;if(st!=='play')return;if(fly){fly.t+=dt;fly.x+=fly.vx*dt;fly.y+=fly.vy*dt;fly.vy+=300*dt;}
if(ball){if(pause>0){pause-=dt;return}ball.y+=ball.v*dt;ball.x+=ball.dx*dt;if(ball.y>600){wk++;balls++;say('BOWLED! Out','#ff6b6b');ball=null;setTimeout(next,1000)}}}
function T(s,X,Y,sz,col,al){x.font='bold '+sz+'px system-ui,Arial';x.fillStyle=col||'#fff';x.textAlign=al||'center';x.fillText(s,X,Y)}
function draw(){var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5ec2ff');g.addColorStop(.28,'#bfe9ff');g.addColorStop(.28,'#3f9b4a');g.addColorStop(1,'#2e7d3a');x.fillStyle=g;x.fillRect(0,0,W,H);
x.fillStyle='#c9a36b';x.beginPath();x.moveTo(140,110);x.lineTo(220,110);x.lineTo(280,H);x.lineTo(80,H);x.fill();x.fillStyle='#fff';x.fillRect(125,98,110,3);
x.strokeStyle='#fff8';x.lineWidth=3;x.beginPath();x.arc(180,ZY,34,0,7);x.stroke();
for(var i=0;i<3;i++){x.fillStyle='#f4e4b0';x.fillRect(166+i*14,582,5,30)}
x.fillStyle='#2f5fd0';x.fillRect(160,540,40,50);x.fillStyle='#f2c9a0';x.beginPath();x.arc(180,530,13,0,7);x.fill();x.fillStyle='#e03a3a';x.fillRect(166,518,28,8);
x.save();x.translate(206,556);x.rotate(swung?-1.1:.5);x.fillStyle='#d9a45c';x.fillRect(-4,-44,10,60);x.restore();
if(ball){x.fillStyle='#0003';x.beginPath();x.ellipse(ball.x,ball.y+12,10,4,0,0,7);x.fill();x.fillStyle='#d62828';x.beginPath();x.arc(ball.x,ball.y,10+ball.y/90,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.arc(ball.x,ball.y,6+ball.y/90,.4,2.6);x.stroke()}
if(fly&&fly.y>-40){x.fillStyle='#d62828';x.beginPath();x.arc(fly.x,fly.y,9,0,7);x.fill()}
T('Runs '+runs,12,34,24,'#fff','left');T('Best '+best,W-12,32,16,'#17324d','right');T('Balls left '+Math.max(0,BALLS-balls),12,58,16,'#17324d','left');T('Wickets '+(WK-wk)+'/'+WK,W-12,56,16,'#17324d','right');
if(msgT>0&&st==='play')T(msg,W/2,300,44,msgC);
if(st!=='play'){x.fillStyle='#000b';x.fillRect(0,0,W,H);T('SIX HITTER',W/2,220,40,'#ffd23f');if(st==='over'){T('Innings over!',W/2,282,28);T('You scored '+runs,W/2,326,28,'#7CFF8A');T('Best '+best,W/2,360,20,'#ffe08a')}else{T('Tap when the ball',W/2,290,20);T('reaches the white circle',W/2,316,20);T('Perfect timing = SIX!',W/2,356,20,'#ffd23f');T('3 wickets, 12 balls',W/2,388,16,'#bfe8ff')}T(st==='over'?'Tap to play again':'Tap to start',W/2,450,24,'#7CFF8A')}}
var last=performance.now();function loop(n){var dt=Math.min(.05,(n-last)/1000);last=n;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
